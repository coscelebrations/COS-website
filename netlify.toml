[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML: no long cache so deploys go live immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets: 1 year cache (bust by renaming file when content changes)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[redirects]]
  from = "https://www.coscelebrations.com/*"
  to = "https://coscelebrations.com/:splat"
  status = 301
  force = true

# The Link Finder at /group-reply/ is a static page - no serverless function,
# no API key, no cost. It runs entirely in the browser from config.js and
# routing.js. A functions block sat here from 2026-08-26 to 2026-08-29, for a
# version that also drafted the reply text; removed when the tool was cut back
# to link lookup only. The drafting code is in git history at commit 4e9f091.

# The Link Finder is an internal tool. Never cache it, never index it. The meta
# robots tag on the page says the same thing - this is belt and braces, and it
# also covers config.js and routing.js, which sit in the same directory.
# The "/*.html" rule above does not reliably match the pretty URL
# "/group-reply/", which is why this is its own explicit block.
[[headers]]
  for = "/group-reply/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/group-reply"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# The Gear Room at /gear/ is an internal team app, same shape as /group-reply/
# above: never cache it, never index it. Added 2026-09-23.
#
# The caching half is the one that actually bites. The "/*.js" rule near the top
# sets a ONE YEAR cache, which would apply to /gear/seed.js, and the "/*.html"
# rule does not reliably match the pretty URL "/gear/" - that is exactly why
# /group-reply/ needed its own block. A DJ's phone holding a year-old copy of a
# gear app that Corey is actively changing is a real support problem, not a
# theoretical one.
#
# The robots half is belt and braces: the page already carries
# <meta name="robots" content="noindex,nofollow"> at index.html:6 and robots.txt
# already has "Disallow: /gear/". A Disallow stops the crawl but does not stop
# the URL being indexed if something ever links to it; the header does.
[[headers]]
  for = "/gear/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/gear"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# INTERNAL FILES MUST NOT BE SERVED. publish = "." makes every repo file a public URL;
# on 2026-09-17 these returned 200 on the live domain. Netlify has no /*.md splat, so
# root files are listed by name; folders use a trailing splat. "to" is the homepage
# served with a 404 status (no 404.html exists in this repo). Add new root .md files here.
# (.bak files need no rule: they are gitignored and never reach Netlify - checked 2026-09-17.)
[[redirects]]
  from = "/SEO.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/SEO-ARCHIVE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/NEXT_SESSION.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/TECHNICAL-AUDIT-REPORT.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/INSTAGRAM.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

