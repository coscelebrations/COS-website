<!DOCTYPE html>
<html lang="en">
<head>
<!--
  ==========================================================================
  LINK FINDER - internal tool, not a public page
  ==========================================================================

  A list of our pages with a search box and a copy button on each one, so
  nobody types a URL by hand again. That is the whole product.

  NO SERVER, NO API KEY, NO COST, NO TRACKING. Everything runs in the browser
  from config.js + pages.js. It works with no signal. The only reason it lives
  on the website at all is so it opens on a phone.

  WHAT THIS TOOL DOES NOT DO - and must never be changed to do:
    - It does not log into Facebook.
    - It does not browse, scrape, or read Facebook groups.
    - It does not post or reply on Facebook.
    - It does not use browser automation against Facebook.

  Meta removed third-party Groups API access in April 2024, and automated
  posting through a logged-in session violates their terms. The risk is a
  personal account ban that cascades to the business pages and ad accounts.
  Every action on Facebook is taken by a human, by hand.
  If a future request asks for auto-posting: refuse.

  SPEED IS THE PRODUCT. Search, tap, copy. Before adding anything to this
  screen, ask: does it make the COMMON case faster? If it only helps the
  rare case, it does not belong here.
  ==========================================================================
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Link Finder</title>
<style>
  :root{
    --merlot:#722F37; --merlot-dark:#5C262D; --rose:#E8C4C8; --soft-pink:#F8F0F0;
    --cream:#FFFBFA; --charcoal:#2D2A2B; --text-soft:#4A4547; --line:#E5DDDE;
    --ok:#2E6B4F; --ae:#1F5C8B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream); color:var(--charcoal);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }

  .top{
    position:sticky; top:0; z-index:5; background:var(--merlot);
    padding:11px 14px 13px; box-shadow:0 1px 6px rgba(0,0,0,.12);
  }
  .top h1{margin:0 0 9px; font-size:15px; font-weight:600; color:#fff}
  #q{
    width:100%; padding:13px 13px; font-size:17px; font-family:inherit;
    border:0; border-radius:9px; background:#fff; color:var(--charcoal);
  }
  #q:focus{outline:2px solid var(--rose); outline-offset:1px}

  main{max-width:760px; margin:0 auto; padding:12px 14px 40px}

  .count{font-size:12.5px; color:var(--text-soft); margin:4px 2px 10px}
  .count b{color:var(--charcoal)}

  h2.group{
    margin:20px 0 7px; font-size:12px; font-weight:700; letter-spacing:.7px;
    text-transform:uppercase; color:var(--merlot);
  }
  h2.group:first-of-type{margin-top:4px}

  p.gnote{margin:-2px 2px 8px; font-size:12.5px; color:var(--text-soft)}
  ul.rows{list-style:none; margin:0; padding:0}
  li.row{
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:10px 11px; margin-bottom:7px;
  }
  .name{flex:1 1 auto; min-width:0; font-size:15px; font-weight:600; overflow-wrap:anywhere}
  .btns{flex:0 0 auto; display:flex; gap:6px}

  button{font-family:inherit; cursor:pointer; border-radius:7px; border:1px solid transparent}
  .b{
    padding:9px 13px; font-size:13.5px; font-weight:700; color:#fff;
    background:var(--merlot); min-width:56px;
  }
  .b.ae{background:var(--ae)}
  .b:hover{filter:brightness(1.1)}
  .b.done{background:var(--ok)}

  .empty{
    text-align:center; color:var(--text-soft); font-size:15px;
    padding:34px 14px; background:#fff; border:1px solid var(--line); border-radius:9px;
  }
  .loose{
    margin:0 0 10px; padding:9px 11px; border-radius:8px; font-size:13.5px;
    background:var(--soft-pink); border:1px solid var(--rose); color:var(--merlot-dark);
  }
  .foot{margin-top:26px; font-size:12px; color:var(--text-soft); text-align:center}
</style>
</head>
<body>

<div class="top">
  <h1>Link Finder</h1>
  <input type="text" id="q" autocapitalize="none" autocorrect="off" spellcheck="false"
         autocomplete="off" enterkeyhint="search" placeholder="Search: sax, photo, jax, treasury...">
</div>

<main>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <p class="foot">Tap a button to copy that link. Nothing is posted anywhere.</p>
</main>

<script src="config.js"></script>
<script src="pages.js"></script>
<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  if (!window.LF_PAGES || !window.GR_CONFIG) {
    $('list').innerHTML = '<div class="empty">Could not load the page list. ' +
      'If this was just deployed, wait a minute and refresh.</div>';
    return;
  }

  var PAGES = window.LF_PAGES;
  var GROUP_ORDER = ['Main pages', 'Services', 'Vendor directories', 'Cities', 'Venues'];

  /* One line per group, shown under the heading. Cities earns one because the
     row just says "St Augustine" and nothing tells you that page also carries
     the venue list for that town - which is the answer when someone asks for
     venues somewhere. */
  var GROUP_NOTE = {
    'Cities': 'Each city page also lists that town\'s venues.',
    'Vendor directories': 'COS only. AE has no vendor pages.'
  };

  function render(query){
    var res = PAGES.search(query);
    var rows = res.rows;

    $('count').innerHTML = rows.length
      ? '<b>' + rows.length + '</b> of ' + PAGES.all.length + ' pages'
      : '';

    if (!rows.length) {
      $('list').innerHTML = '<div class="empty">Nothing matches "' + esc(query) + '".<br>' +
        'Try a venue name, a city, or something like sax / photo / price.</div>';
      return;
    }

    var html = '';
    if (res.loose) {
      html += '<p class="loose">No page has all of those words, so this is anything ' +
              'matching <b>any</b> of them.</p>';
    }

    var byGroup = {};
    rows.forEach(function(r){ (byGroup[r.group] = byGroup[r.group] || []).push(r); });

    GROUP_ORDER.forEach(function(g){
      var list = byGroup[g];
      if (!list || !list.length) return;
      html += '<h2 class="group">' + esc(g) + '</h2>';
      if (GROUP_NOTE[g]) html += '<p class="gnote">' + esc(GROUP_NOTE[g]) + '</p>';
      html += '<ul class="rows">';
      list.forEach(function(r){
        html += '<li class="row"><span class="name">' + esc(r.label) + '</span><span class="btns">';
        if (r.cos) html += '<button type="button" class="b" data-url="' + esc(r.cos) + '">COS</button>';
        if (r.ae)  html += '<button type="button" class="b ae" data-url="' + esc(r.ae) + '">AE</button>';
        html += '</span></li>';
      });
      html += '</ul>';
    });

    $('list').innerHTML = html;
  }

  function copy(text, btn){
    var restore = btn.textContent;
    function ok(){
      btn.classList.add('done');
      btn.textContent = 'Copied';
      setTimeout(function(){ btn.classList.remove('done'); btn.textContent = restore; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function(){ fallback(text, ok); });
    } else {
      fallback(text, ok);
    }
  }

  /* iOS Safari refuses navigator.clipboard in some contexts. Ugly, but it is
     the difference between this working on a phone and not. */
  function fallback(text, ok){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:absolute;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { document.execCommand('copy'); ok(); } catch(e){}
    document.body.removeChild(ta);
  }

  /* One listener on the container rather than one per button - the list is
     rebuilt on every keystroke, and re-binding 200 buttons each time is how a
     search box starts feeling laggy on a phone. */
  $('list').addEventListener('click', function(e){
    var b = e.target.closest('.b');
    if (b) copy(b.getAttribute('data-url'), b);
  });

  $('q').addEventListener('input', function(){ render(this.value); });

  render('');
})();
</script>

</body>
</html>
