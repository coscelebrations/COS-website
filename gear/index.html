<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- Added 2026-09-23. A tab left open from before an edit hands out stale code.
     That is not theoretical: on 2026-09-23 the Setup screen's Copy button gave
     out the pre-fix ruleset from a tab opened earlier the same session, and it
     was one click from taking 792 leads offline. Belt to the no-store header
     in netlify.toml, which does not apply to python -m http.server. -->
<meta http-equiv="Cache-Control" content="no-store">
<title>Gear Room</title>
<meta name="theme-color" content="#722F37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gear Room">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --merlot:#722F37; --merlot-dark:#5C262D; --rose:#E8C4C8; --soft-pink:#F8F0F0;
  --cream:#FFFBFA; --charcoal:#2D2A2B; --text-soft:#4A4547; --neutral:#6B6669;
  --ae-blue:#1B5E7E;
  --red:#B0303D; --red-bg:#FBEAEC;
  --green:#2E7D5A; --green-bg:#E6F2EC;
  --amber:#8B6914; --amber-bg:#FBF3DF;
  --line:#EADFE0;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--charcoal);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--merlot)}

/* ---------- shell ---------- */
.wrap{max-width:600px;margin:0 auto;padding:0 1rem 6.5rem}
header.bar{position:sticky;top:0;z-index:40;background:var(--cream);
  padding:calc(env(safe-area-inset-top) + .75rem) 0 .6rem;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem}
header.bar h1{font-size:1.15rem;margin:0;color:var(--merlot);font-weight:650;letter-spacing:-.01em;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--neutral);flex:none}
.dot[data-s=synced]{background:var(--green)}
.dot[data-s=syncing]{background:#C9A54D;animation:blink 1s ease-in-out infinite}
.dot[data-s=offline]{background:var(--neutral)}
.dot[data-s=error]{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.whobtn{background:none;border:1px solid var(--line);border-radius:999px;
  padding:.3rem .7rem;font-size:.78rem;color:var(--text-soft);cursor:pointer}

/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,251,250,.96);
  backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:.55rem 0 .5rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.18rem;
  font-size:.68rem;letter-spacing:.02em;color:var(--neutral);font-weight:550}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--merlot)}
nav.tabs .pip{position:absolute;transform:translate(14px,-4px);min-width:16px;height:16px;
  border-radius:9px;background:var(--red);color:#fff;font-size:.6rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- generic ---------- */
h2.sec{font-size:.72rem;color:var(--neutral);text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;margin:1.6rem 0 .6rem}
h2.sec:first-child{margin-top:1.1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem;
  margin-bottom:.7rem;box-shadow:var(--shadow)}
.muted{color:var(--text-soft);font-size:.87rem;line-height:1.5}
.tiny{font-size:.75rem;color:var(--neutral)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  min-height:46px;padding:.7rem 1.05rem;border-radius:11px;border:1px solid var(--line);
  background:#fff;font-weight:600;font-size:.92rem;cursor:pointer;width:100%}
.btn.primary{background:var(--merlot);border-color:var(--merlot);color:#fff}
.btn.primary:active{background:var(--merlot-dark)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--rose)}
.btn.sm{min-height:38px;padding:.4rem .8rem;font-size:.82rem;width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.pill{display:inline-block;padding:.18rem .55rem;border-radius:999px;font-size:.7rem;
  font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.pill.cos{background:var(--soft-pink);color:var(--merlot)}
.pill.ae{background:#E8F1F6;color:var(--ae-blue)}
.pill.in{background:var(--green-bg);color:var(--green)}
.pill.out{background:var(--amber-bg);color:var(--amber)}
.pill.repair{background:var(--red-bg);color:var(--red)}
.pill.retired{background:#EFEDED;color:var(--neutral)}
.banner{border-radius:12px;padding:.8rem .9rem;font-size:.85rem;line-height:1.45;margin:.9rem 0}
.banner.warn{background:var(--red-bg);color:#7A1E29;border:1px solid #F0C9CE}
.banner.info{background:var(--soft-pink);color:var(--merlot);border:1px solid var(--rose)}
.banner.ok{background:var(--green-bg);color:#1F5B41;border:1px solid #C4E2D3}
/* only the leading title goes on its own line - a <b> mid-sentence must stay inline */
.banner > b:first-child{display:block;margin-bottom:.2rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--neutral)}
.empty svg{width:44px;height:44px;stroke:var(--rose);fill:none;stroke-width:1.4;margin-bottom:.8rem}
label.fl{display:block;font-size:.78rem;font-weight:650;color:var(--text-soft);
  margin:.9rem 0 .3rem;letter-spacing:.01em}
input[type=text],input[type=date],input[type=time],input[type=email],
input[type=password],select,textarea{width:100%;padding:.7rem .8rem;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:130px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:var(--merlot)}

/* ---------- event card ---------- */
.ev{background:#fff;border:1px solid var(--line);border-left:4px solid var(--merlot);
  border-radius:14px;padding:.95rem 1rem;margin-bottom:.7rem;box-shadow:var(--shadow);
  cursor:pointer;position:relative}
.ev.ae{border-left-color:var(--ae-blue)}
.ev.conflict{border-color:var(--red);box-shadow:0 2px 10px rgba(176,48,61,.14)}
.ev .when{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--neutral)}
.ev .who{font-size:1.12rem;font-weight:650;margin:.15rem 0 .1rem;letter-spacing:-.01em}
.ev .venue{font-size:.87rem;color:var(--text-soft)}
.ev .meta{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}
.ev .arrow{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-right:2px solid var(--rose);border-top:2px solid var(--rose);
  rotate:45deg}
.svcs{font-size:.78rem;color:var(--neutral);margin-top:.35rem}

/* ---------- checklist ---------- */
.progress{height:6px;border-radius:4px;background:var(--soft-pink);overflow:hidden;margin:.7rem 0 .2rem}
.progress i{display:block;height:100%;background:var(--merlot);border-radius:4px;
  transition:width .35s cubic-bezier(.4,1.3,.5,1)}
.check{display:flex;gap:.8rem;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:.85rem .9rem;
  margin-bottom:.5rem;cursor:pointer;transition:background .15s,border-color .15s}
.check:active{background:var(--soft-pink)}
.check .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--rose);
  display:flex;align-items:center;justify-content:center;margin-top:-1px;
  transition:background .2s,border-color .2s,transform .2s}
.check .box svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);
  transition:opacity .18s,transform .22s cubic-bezier(.4,1.6,.5,1)}
.check .txt{font-size:.93rem;line-height:1.4;padding-top:.15rem}
.check[data-on="1"]{border-color:var(--green-bg);background:#FAFDFB}
.check[data-on="1"] .box{background:var(--green);border-color:var(--green);transform:scale(1.04)}
.check[data-on="1"] .box svg{opacity:1;transform:scale(1)}
.check[data-on="1"] .txt{color:var(--neutral);text-decoration:line-through;text-decoration-color:var(--rose)}
.alldone{text-align:center;padding:2rem 1rem;background:var(--green-bg);border-radius:14px;
  color:#1F5B41;margin-bottom:.9rem}
.alldone .big{font-size:1.35rem;font-weight:650;margin-bottom:.25rem}

/* ---------- item rows ---------- */
.item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:11px;padding:.7rem .85rem;margin-bottom:.4rem;cursor:pointer}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:.92rem;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.item .nm span{font-size:.74rem;color:var(--neutral)}
.item.out{background:#FEFCF6}
.item.repair{background:#FDF7F8;border-color:#F0C9CE}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.15rem 0 .6rem;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.4rem .8rem;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:.8rem;cursor:pointer;white-space:nowrap;font-weight:550}
.chip[aria-pressed=true]{background:var(--merlot);border-color:var(--merlot);color:#fff}
.search{position:relative;margin:.2rem 0 .6rem}
.search input{padding-left:2.2rem}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:17px;height:17px;
  stroke:var(--neutral);fill:none;stroke-width:2}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(45,42,43,.45);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--cream);
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.35,1);
  padding:0 1rem calc(1.4rem + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px rgba(0,0,0,.16)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--rose);margin:.6rem auto 1rem}
.sheet h3{margin:0 0 .2rem;font-size:1.2rem;letter-spacing:-.01em}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.87rem}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--neutral)}
.kv b{font-weight:600;text-align:right}

/* ---------- pull list ---------- */
.kitblk{margin-bottom:1rem}
.kitblk h4{margin:0 0 .1rem;font-size:.95rem;font-weight:650}
.kitblk .kn{font-size:.76rem;color:var(--neutral);margin-bottom:.5rem}
.conflictrow{background:var(--red-bg);border-color:#F0C9CE}
.conflictrow .nm span{color:var(--red);font-weight:600}
.sticky-act{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,251,250,0),var(--cream) 32%);
  padding:1rem 0 .5rem;margin-top:.5rem}

/* ---------- misc rows ---------- */
.navrow{display:flex;align-items:center;gap:.8rem;width:100%;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:.85rem .9rem;margin-bottom:.5rem;
  cursor:pointer;text-align:left;font-size:.93rem;font-weight:550}
.navrow svg{width:19px;height:19px;stroke:var(--merlot);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.navrow .grow{flex:1}
.navrow .go{width:7px;height:7px;border-right:2px solid var(--rose);border-top:2px solid var(--rose);rotate:45deg}
.log{font-size:.82rem;padding:.55rem 0;border-bottom:1px solid var(--line);line-height:1.45}
.log:last-child{border-bottom:0}
.log b{font-weight:650}
.log em{font-style:normal;color:var(--neutral);font-size:.74rem;display:block;margin-top:.1rem}
.back{background:none;border:0;color:var(--merlot);font-size:.85rem;font-weight:600;
  padding:.7rem 0 .2rem;cursor:pointer;display:flex;align-items:center;gap:.35rem}
.back::before{content:'';width:7px;height:7px;border-left:2px solid var(--merlot);
  border-bottom:2px solid var(--merlot);rotate:45deg}
table.prev{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:.6rem}
table.prev th{text-align:left;padding:.35rem .4rem;background:var(--soft-pink);color:var(--merlot);
  font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
table.prev td{padding:.35rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:90;background:var(--charcoal);color:#fff;
  padding:.65rem 1.05rem;border-radius:999px;font-size:.85rem;font-weight:550;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- sign in ---------- */
.gate{max-width:380px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 3rem) 1.2rem 3rem}
.gate h1{color:var(--merlot);font-size:1.6rem;margin:0 0 .3rem;letter-spacing:-.02em}
.gate .sub{color:var(--text-soft);font-size:.92rem;line-height:1.5;margin-bottom:1.6rem}
.err{color:var(--red);font-size:.83rem;margin-top:.7rem;min-height:1.1em}
.hr{display:flex;align-items:center;gap:.8rem;margin:1.5rem 0;color:var(--neutral);font-size:.75rem}
.hr::before,.hr::after{content:'';flex:1;height:1px;background:var(--line)}
.hide{display:none !important}
@media (min-width:620px){.wrap{padding-bottom:2rem}nav.tabs{max-width:600px;margin:0 auto;border-radius:16px 16px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>

<!-- ============ SIGN IN ============ -->
<div class="gate hide" id="gate">
  <h1>Gear Room</h1>
  <p class="sub">Who has what, what goes out this weekend, and the checklist before you leave the house.</p>

  <label class="fl" for="gEmail">Email</label>
  <input type="email" id="gEmail" autocomplete="username" placeholder="you@coscelebrations.com">
  <label class="fl" for="gPass">Password</label>
  <input type="password" id="gPass" autocomplete="current-password">
  <div class="err" id="gErr"></div>
  <button class="btn primary" id="gSignIn" style="margin-top:.9rem">Sign in</button>
  <button class="btn ghost sm" id="gReset" style="width:100%;margin-top:.5rem;border:0;color:var(--neutral)">Forgot password</button>

  <div class="hr">or</div>
  <button class="btn" id="gLocal">Use on this device only</button>
  <p class="tiny" style="margin-top:.6rem;line-height:1.5">Device-only mode keeps everything in this browser. Nothing syncs to the team. Good for trying it out.</p>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <div class="wrap">
    <header class="bar">
      <h1 id="ttl">Gear Room</h1>
      <span class="dot" id="dot" data-s="offline" title="sync"></span>
      <button class="whobtn" id="whoBtn">-</button>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>Today</span>
    </button>
    <button data-tab="gear">
      <svg viewBox="0 0 24 24"><path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2"/><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 12h6"/></svg>
      <span>Gear</span>
    </button>
    <button data-tab="week">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 4-6 5 5"/><path d="M3 21h18"/></svg>
      <span>Week</span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>More</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { CATEGORIES, HOMES, ITEMS, KITS, SERVICE_MAP, CHECKLISTS, derivePool } from './seed.js';

/* Firebase is loaded LAZILY and never blocks the app.
   It used to be a plain static import from the gstatic CDN, which meant that if
   that request was slow, blocked, or offline, the whole module failed to
   execute and the DJ got a blank white screen. That is the exact situation this
   app exists for - standing next to a van, one bar of signal, needing the pull
   list. So: boot from the local cache immediately, then upgrade to team sync in
   the background if and when the network cooperates. 2026-08-11. */
const FB_BASE = "https://www.gstatic.com/firebasejs/12.13.0/";
const firebaseConfig = {
  apiKey: "AIzaSyAaUvaWjrlkwp5q7qqlWPAJiiL7lVTvVgU",
  authDomain: "cos-tracker-35556.firebaseapp.com",
  projectId: "cos-tracker-35556",
  storageBucket: "cos-tracker-35556.firebasestorage.app",
  messagingSenderId: "821506336514",
  appId: "1:821506336514:web:81f22281f7bcb40a93041b"
};

let auth = null, db = null, fbReady = false, fbFailed = false;
let signInWithEmailAndPassword, signOut, sendPasswordResetEmail, onAuthStateChanged;
let collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp, addDoc, query, orderBy, limit;

let fbPromise = null;
function ensureFb(){
  if (fbPromise) return fbPromise;
  fbPromise = (async () => {
    const [a, au, fs] = await Promise.all([
      import(FB_BASE + "firebase-app.js"),
      import(FB_BASE + "firebase-auth.js"),
      import(FB_BASE + "firebase-firestore.js")
    ]);
    const app = a.initializeApp(firebaseConfig);
    auth = au.getAuth(app);
    db = fs.getFirestore(app);
    ({ signInWithEmailAndPassword, signOut, sendPasswordResetEmail, onAuthStateChanged } = au);
    ({ collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp, addDoc, query, orderBy, limit } = fs);
    fs.enableIndexedDbPersistence(db).catch(()=>{});
    fbReady = true;
    return true;
  })().catch(e => { fbFailed = true; fbPromise = null; throw e; });
  return fbPromise;
}

const C = { items:'gear_items', events:'gear_events', runs:'gear_runs',
            activity:'gear_activity', config:'gear_config' };

/* ================= state ================= */
const BUILD = '2026-09-23-f';   // shown at the bottom of More. Bump on any visible change.
const ROSTER = ['Corey','Kyle','CJ','Noah','Greg','Mikey','Justin','Cole','Matt'];
const ADMINS = ['corey','kyle'];
/* Two different powers, deliberately not the same list. Added 2026-09-23 at
   Corey's request: "only Corey can delete and add gear. For now. Maybe later
   down the road with management."

   ADMINS is the OFFICE role - seeing everyone's overdue gear, landing on the
   Week tab, editing checklist wording, and assigning gear to a person. Kyle
   runs the office, so she keeps all of it.

   GEAR_EDITORS is the INVENTORY role - adding, editing and deleting the gear
   list itself. Corey owns the gear and is the only one who should be able to
   change what exists. Deleting is irreversible and a wrong quantity is what
   started this.

   Adding a manager later is one name in this array. When that happens it should
   move into the synced config (see S.settings in the plan) so it is a tap in
   Setup rather than a deploy - but a const is honest today, and the app is not
   deployed yet, so there is nothing to redeploy. */
const GEAR_EDITORS = ['corey'];
const LS = 'gearroom.v1';

const S = {
  mode: null,              // 'cloud' | 'local'
  uid: '', email: '',
  me: '',                  // display name from ROSTER
  items: [], events: [], kits: [], checklists: [], runs: {}, activity: [], staff: {},
  route: { tab:'today', view:'', id:'' },
  gearFilter: 'all', gearQ: '', importMode: 'events', rawImport: null, rawName: '', addonMap: {}, addonCatalog: {},
  rulesError: false
};

function blank(){
  return {
    items: JSON.parse(JSON.stringify(ITEMS)),
    events: [],
    kits: JSON.parse(JSON.stringify(KITS)),
    checklists: JSON.parse(JSON.stringify(CHECKLISTS)),
    runs: {},
    activity: [],
    staff: {},
    addonMap: {},
    addonCatalog: {}
  };
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(LS);
    if (!raw) return blank();
    const d = JSON.parse(raw);
    const b = blank();
    /* seeded: this device has saved at least once, so an EMPTY list is a real
       answer ("I deleted the starter gear") and not "first run, fill it in".
       Without this, deleting your way down to zero items silently repopulated
       all 53 template items on the next reload -- which reads as the app
       undoing your work. Installs from before 2026-08-25 have no flag, so they
       fall back to the old behaviour once and get stamped on the next save.
       Checklists deliberately still re-seed: checklistEditSheet edits the list
       in place and has no way to restore one you emptied. */
    const seeded = !!d.seeded;
    return {

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2,9);

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function parseYMD(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function dayDiff(a,b){ return Math.round((parseYMD(b)-parseYMD(a))/86400000); }
/* just the date, no "In 4 days -" prefix. Use this anywhere the date sits
   inside a sentence, where the relative wording reads as a mistake. */
function plainDay(s){
  return parseYMD(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
function prettyDay(s){
  const n = dayDiff(today(), s);
  const d = parseYMD(s);
  const base = d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  if (n === 0) return 'Today - ' + base;
  if (n === 1) return 'Tomorrow - ' + base;
  if (n < 0) return base + ' (' + Math.abs(n) + 'd ago)';
  if (n <= 7) return 'In ' + n + ' days - ' + base;
  return base;
}
function ago(iso){
  if (!iso) return '';
  const mins = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const h = Math.round(mins/60);
  if (h < 24) return h + 'h ago';
  return Math.round(h/24) + 'd ago';
}
function toast(msg){

  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2200);

const isAdmin = () => ADMINS.includes(String(S.me).toLowerCase());
const canEditGear = () => GEAR_EDITORS.includes(String(S.me).toLowerCase());
const itemById = id => S.items.find(i => i.id === id);
const eventById = id => S.events.find(e => e.id === id);

/* required item ids for an event = always-kits + kits matched from services */
/* Three ways an event resolves to kits, best first. If the CRM System IDs are
   present we never guess at all. */
function kitsFor(ev){
  const out = S.kits.filter(k => k.always && !k.disabled).map(k => k.id);
  const add = id => { if (id && !out.includes(id)) out.push(id); };

  // 1. exact: System 1..10 from the CRM Events report, matched on System ID
  let exact = false;
  (ev.systemIds || []).forEach(sid => {
    const k = S.kits.find(x => String(x.sysId) === String(sid));
    if (k && !k.disabled) { add(k.id); exact = true; }
  });

  const hay = ((ev.services||'') + ' ' + (ev.notes||'')).toLowerCase();
  // 2. a kit named outright in the event text
  S.kits.forEach(k => {
    if (k.disabled || k.always) return;
    const n = String(k.name||'').toLowerCase().trim();
    if (n.length > 2 && hay.includes(n)) add(k.id);
  });
  // 3. keyword fallback, only when the CRM gave us nothing exact
  if (!exact) {
    SERVICE_MAP.forEach(m => {
      if (m.match.some(w => hay.includes(w))) {
        const k = S.kits.find(x => x.id === m.kit);
        if (k && !k.disabled) add(m.kit);
      }
    });
  }
  (ev.extraKits||[]).forEach(add);
  return out.map(id => S.kits.find(k => k.id === id)).filter(Boolean);
}
function requiredItemIds(ev){
  const set = new Set();
  kitsFor(ev).forEach(k => (k.items||[]).forEach(i => set.add(i)));
  return [...set];
}
/* Clash detection works on POOLS, not individual units.
   Two weddings on one Saturday both need a "Main Speaker" - that is fine if you
   own two. The warning should only fire when demand on a date exceeds what
   actually exists and is working. Counting per-unit instead produced 17 fake
   clashes for a normal double-header, which is the fastest way to get an alert
   ignored forever. 2026-08-11. */
const poolOf = i => i.pool || i.name;
/* What an event needs, as pool -> unit count.
   Kits contribute one of each; addons contribute their real quantity, which is
   the whole point - an event wants 16 uplights, not "some uplighting". */
/* Gear written down by hand as "Noah needs these on Friday". Stored as pool +
   quantity because that is how Corey says it - "16 uplights and the booth".
   Kits hold individual unit ids, which cannot express a number.

   Added 2026-09-23. Corey wanted the DJs to get a pickup list to tick off while
   loading the van, but did not want to type a full wedding record to get one:
   "I'd rather not do that, that could get very time consuming. Maybe just
   putting in there the day the dj needs the stuff?" So a job here is a person,
   a day and a list - no venue, no client, no times. Everything downstream
   already works off exactly those three things. */
function gearNeeds(ev){
  const need = {};
  (ev.gear || []).forEach(g => {
    const q = Math.max(0, Math.round(Number(g.qty) || 0));
    if (q > 0 && g.pool) need[g.pool] = q;
  });
  return need;
}
/* What to call a job on screen. A wedding has a couple's name; a "Noah needs
   these on Friday" note has nobody's, and every screen that printed
   `client || venue` would have shown a blank or the word "Event". Falls back to
   the person, which is the only name that job has. 2026-09-23. */
function evLabel(e){
  if (!e) return 'Event';
  return e.client || e.venue || (e.dj ? 'Gear for ' + e.dj : 'Gear');
}
function poolNeeds(ev){
  /* An exact list is the whole truth for that job - kits and CRM addons stop
     contributing, so what is on the screen is what gets pulled. Anything
     without gearMode takes the identical path it always has, so every imported
     event behaves exactly as before. */
  if (ev && ev.gearMode === 'exact') return gearNeeds(ev);
  const need = {};
  requiredItemIds(ev).forEach(id => {
    const i = itemById(id); if (!i) return;
    const p = poolOf(i);
    need[p] = (need[p] || 0) + 1;
  });
  const fromAddons = addonNeeds(ev);
  Object.keys(fromAddons).forEach(p => {
    need[p] = Math.max(need[p] || 0, fromAddons[p]);   // addon count wins
  });
  return need;
}
/* The units a person should physically carry for an event: n free units of each
   needed pool, preferring ones already checked out to them. */
function unitsForNeed(pool, n, who){
  const mine = S.items.filter(i => poolOf(i) === pool && i.status === 'out' && i.holder === who);
  const free = S.items.filter(i => poolOf(i) === pool && i.status === 'in');
  return mine.concat(free).slice(0, n);
}
/* a unit flagged for repair is not supply - it cannot go out */
function supplyOf(pool){
  return S.items.filter(i => poolOf(i) === pool && i.status !== 'retired' && i.status !== 'repair').length;
}
function freeUnits(pool){
  return S.items.filter(i => poolOf(i) === pool && i.status === 'in');
}
/* which unit should this person actually walk out with */
function resolveUnit(i){
  if (i.status === 'in') return i;
  if (i.status === 'out' && i.holder === S.me) return i;
  return freeUnits(poolOf(i)).find(x => x.id !== i.id) || i;
}
function conflicts(){
  const byDate = {};
  S.events.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  const out = [];
  Object.keys(byDate).forEach(date => {
    const evs = byDate[date];
    const total = {};
    evs.forEach(e => {
      const n = poolNeeds(e);
      Object.keys(n).forEach(p => { total[p] = (total[p] || 0) + n[p]; });
    });
    Object.keys(total).forEach(p => {
      const have = supplyOf(p);
      if (total[p] > have) out.push({ date, pool:p, need:total[p], have, short: total[p] - have, events: evs });
    });
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || b.short - a.short);
}
function conflictsFor(ev){
  return conflicts().filter(c => c.events.some(e => e.id === ev.id));
}
function shortPoolsOn(date){
  const s = {};
  conflicts().filter(c => c.date === date).forEach(c => { s[c.pool] = c; });
  return s;
}
function myEvents(){
  const t = today();
  return S.events
    .filter(e => dayDiff(t, e.date) >= -1)
    .filter(e => !S.me || !e.dj || String(e.dj).toLowerCase().includes(S.me.toLowerCase())
                 || String(e.dj2||'').toLowerCase().includes(S.me.toLowerCase()))
    .sort((a,b) => a.date.localeCompare(b.date));
}
function upcoming(days){
  const t = today();
  return S.events.filter(e => { const d = dayDiff(t, e.date); return d >= -1 && d <= days; })
    .sort((a,b) => a.date.localeCompare(b.date) || String(a.time||'').localeCompare(String(b.time||'')));
}
function myOut(){ return S.items.filter(i => i.status === 'out' && i.holder === S.me); }

/* ---- returns are due the Monday after the weekend ----
   Corey's rule, 2026-08-11: everything comes back the Monday following the
   weekend it went out on. Due ON Monday, late from Tuesday. */
function addDaysY(ymdStr, n){
  const d = parseYMD(ymdStr); d.setDate(d.getDate() + n); return ymd(d);
}
function nextMonday(ymdStr){
  const d = parseYMD(ymdStr);
  const add = ((8 - d.getDay()) % 7) || 7;   // strictly after, never same day
  return addDaysY(ymdStr, add);
}
function dueFor(item){
  if (item.status !== 'out') return '';
  const ev = item.eventId ? eventById(item.eventId) : null;
  if (ev) return nextMonday(ev.date);
  if (item.since) return nextMonday(ymd(new Date(item.since)));
  return '';
}
function isOverdue(item){
  const d = dueFor(item);
  return !!d && dayDiff(d, today()) > 0;
}
function overdueItems(who){
  return S.items.filter(i => i.status === 'out' && isOverdue(i)
    && (!who || i.holder === who));
}
function overdueByPerson(){
  const g = {};
  overdueItems().forEach(i => { (g[i.holder || 'unknown'] = g[i.holder || 'unknown'] || []).push(i); });
  return g;
}

/* ---- the weekend ----
   "What am I picking up from the warehouse" is a weekend question, not an
   event question - you make one trip, not three. */
function comingSunday(){
  const d = parseYMD(today());
  return addDaysY(today(), (7 - d.getDay()) % 7);
}
function weekendEvents(who){
  const end = comingSunday();
  return S.events
    .filter(e => dayDiff(today(), e.date) >= 0 && dayDiff(e.date, end) >= 0)
    .filter(e => !who || [e.dj, e.dj2, e.dj3].some(n => n && String(n).toLowerCase().includes(who.toLowerCase())))
    .sort((a,b) => a.date.localeCompare(b.date) || String(a.time||'').localeCompare(String(b.time||'')));
}
/* Everything one person needs across the weekend, as pool -> count.
   Two events each wanting 16 uplights is 32 uplights in the van, so these add
   up rather than dedupe. Shared one-off gear (a single booth) does not double. */
function weekendPull(who){
  const evs = weekendEvents(who);
  const need = {}, why = {};
  evs.forEach(e => {
    const n = poolNeeds(e);
    Object.keys(n).forEach(p => {
      need[p] = (need[p] || 0) + n[p];
      (why[p] = why[p] || []).push(e);
    });
  });
  /* never ask someone to take more than exists */
  Object.keys(need).forEach(p => {
    const owned = S.items.filter(i => poolOf(i) === p && i.status !== 'retired').length;
    if (owned) need[p] = Math.min(need[p], owned);
  });
  return { events: evs, need, why };
}
function heldCount(pool, who){
  return S.items.filter(i => poolOf(i) === pool && i.status === 'out' && i.holder === who).length;
}
function pullTotals(who){
  const { need } = weekendPull(who);
  let want = 0, got = 0;
  Object.keys(need).forEach(p => { want += need[p]; got += Math.min(heldCount(p, who), need[p]); });
  return { want, got, pools: Object.keys(need).length };
}
function peopleThisWeekend(){
  const names = new Set();
  weekendEvents().forEach(e => [e.dj, e.dj2, e.dj3].forEach(n => { if (n) names.add(n); }));
  return [...names].sort();
}

async function putItem(i){
  const idx = S.items.findIndex(x => x.id === i.id);
  if (idx >= 0) S.items[idx] = i; else S.items.push(i);
  saveLocal(); render();
  if (S.mode === 'cloud') await cloudSet(C.items, i.id, i);
}
/* Save a batch in one go. putItem renders and awaits a cloud write per call,
   so looping it for "I own 40 uplights" is 40 renders and 40 round-trips. */
async function putItems(list){
  list.forEach(i => {
    const idx = S.items.findIndex(x => x.id === i.id);
    if (idx >= 0) S.items[idx] = i; else S.items.push(i);
  });
  saveLocal(); render();
  if (S.mode === 'cloud') for (const i of list) await cloudSet(C.items, i.id, i);
}

/* One hand-entered row -> N trackable units, the way the CRM importer does it
   in equipmentToUnits: qty 1 keeps the name as typed, qty > 1 numbers them
   "Uplight 1".."Uplight 40" and they ALL share the un-numbered pool. That
   shared pool is the whole point -- it is what makes supplyOf('Uplight')
   answer 40 instead of 1, which the shortage math and the check-out counter
   both read.

   Deliberately NOT a refactor of equipmentToUnits: that one also preserves
   existing units across a re-import, carries eqId and the CRM extras, and puts
   the serial and the kit-attach on unit 1. It is also the only import path
   with real test coverage, on a screen nobody opens after the 2026-08-25 pivot.
   Three duplicated lines beat regressing it.

   Ids come from uid('i'), never the importer's 'dj-<eqid>-<n>' shape -- a
   re-import decides what to keep with incoming.has(i.id), so a manual id that
   collided with a future CRM id would be silently overwritten. */
function manualUnits(base, qty, existing){
  const n = Math.max(1, Math.min(60, Math.round(Number(qty) || 1)));
  const pool = base.pool || derivePool(base.name) || base.name;
  const start = nextUnitNumber(pool, existing || []);
  const out = [];
  for (let k = 0; k < n; k++) {
    out.push(Object.assign({}, base, {
      id: uid('i'),
      name: n > 1 || start > 1 ? pool + ' ' + (start + k) : base.name,
      pool: pool,
      serial: k === 0 ? (base.serial || '') : '',
      status: 'in', holder: '', holderUid: '', eventId: '', since: '',
      template: false
    }));
  }
  return out;
}

/* Keep numbering where the pool left off. Naive 1..N gives you a second
   "Uplight 1" and nobody can tell the two apart on a shelf. */
function nextUnitNumber(pool, items){
  let max = 0;
  (items || []).forEach(i => {
    if (poolOf(i) !== pool) return;
    const m = /\s(\d+)$/.exec(i.name || '');
    max = Math.max(max, m ? Number(m[1]) : 1);
  });
  return max + 1;
}

/* ================= actions ================= */
/* `who` defaults to whoever is signed in. Added 2026-09-23, on the first real
   piece of gear Corey entered: he owns the monogram and already knew he had
   handed it to Noah the day before, and there was no way to say so. Check-out
   hardcoded S.me, so the only way to record where gear actually was would have
   been to impersonate a teammate from the Change-who-I-am screen - which logs a
   true fact by faking who did it. Corey is the one who knows where everything
   is, so this is most of the job, not an edge case.

   holderUid stays EMPTY when giving to someone else. We know their name from
   the roster but not their Firebase uid, and writing a wrong uid would poison
   the audit trail the append-only gear_activity rule exists to protect. The log
   line carries both facts: who did it (S.me) and who has it (holder). */
async function checkOut(item, ev, who){
  const holder = who || S.me;
  const mine = holder === S.me;
  if (item.status === 'out' && item.holder && item.holder !== holder) {
    if (!confirm(item.name + ' is already out with ' + item.holder + '. '
                 + (mine ? 'Take it anyway?' : 'Give it to ' + holder + ' anyway?'))) return;
  }
  if (item.status === 'repair') {
    if (!confirm(item.name + ' is flagged as needing repair. '
                 + (mine ? 'Take it anyway?' : 'Give it to ' + holder + ' anyway?'))) return;
  }
  const next = { ...item, status:'out', holder, holderUid: mine ? S.uid : '',
                 eventId: ev ? ev.id : '', since: new Date().toISOString() };
  await putItem(next);
  const forEv = ev ? ' for ' + evLabel(ev) : '';
  logIt(mine ? S.me + ' took ' + item.name + forEv
             : S.me + ' gave ' + item.name + ' to ' + holder + forEv, { itemId:item.id });
}
async function checkIn(item){
  const next = { ...item, status:'in', holder:'', holderUid:'', eventId:'', since:'' };
  await putItem(next);
  logIt(S.me + ' returned ' + item.name, { itemId:item.id });
}

/* Take N of a pool in one go. Looping checkOut() would pop a confirm per unit
   and write N separate activity lines -- "Corey took Uplight 1", 12 times.
   One write, one log line. Returns how many actually moved, which can be fewer
   than asked for if a teammate grabbed some between the sheet opening and the
   button being tapped. */
async function checkOutMany(pool, n, who){
  const holder = who || S.me;
  const mine = holder === S.me;
  const take = freeUnits(pool).slice(0, Math.max(0, n));
  if (!take.length) return 0;
  const stamp = new Date().toISOString();
  await putItems(take.map(i => ({ ...i, status:'out', holder, holderUid: mine ? S.uid : '',
                                  eventId:'', since:stamp })));
  /* "12 x Uplight" rather than "12 Uplights" on purpose -- naive pluralising
     turns "Gaff Tape + Tools" into "Toolss". Letter x, not a symbol (Rule #15). */
  const what = take.length > 1 ? take.length + ' x ' + pool : take[0].name;
  logIt(mine ? S.me + ' took ' + what : S.me + ' gave ' + what + ' to ' + holder,
        { pool: pool, n: take.length });
  return take.length;
}
/* Remove units that should never have existed. Added 2026-09-23: Corey typed
   the wrong quantity, ended up with 40 uplights too many, and found there was
   no delete anywhere in the app - only Edit details > Retired, one unit at a
   time. He had also checked them out to himself while trying to get rid of
   them, so a free-units-only delete would not have helped.

   DELETE, not retire. Retiring is for a real thing that broke or was sold, and
   it lingers in the Retired list forever; a typo should leave no trace.

   HIGHEST NUMBERS FIRST, because "I added too many" means the extras are the
   ones on the end - removing Uplight 1 and keeping Uplight 41 would be absurd.

   Takes what is free, flagged, or out WITH YOU. Never touches a unit that is
   out with someone else - that is a real fact about where gear is, and it is
   not this function's business to erase it. Returns how many actually went so
   the caller can be honest about a partial. */
async function removeUnits(pool, n){
  const num = i => { const m = /\s(\d+)$/.exec(i.name || ''); return m ? Number(m[1]) : 0; };
  const takeable = S.items
    .filter(i => poolOf(i) === pool
      && (i.status !== 'out' || i.holder === S.me))
    .sort((a, b) => num(b) - num(a));
  const doomed = takeable.slice(0, Math.max(0, n));
  if (!doomed.length) return 0;
  const gone = new Set(doomed.map(i => i.id));
  S.items = S.items.filter(i => !gone.has(i.id));
  /* kits point at unit ids; leaving them makes viewKits render raw ids like
     "i012" as though they were gear names -- same trap the seed clear hit */
  S.kits.forEach(k => { k.items = (k.items || []).filter(x => !gone.has(x)); });
  saveLocal(); render();
  if (S.mode === 'cloud' && db) {
    for (const id of gone) { try { await deleteDoc(doc(db, C.items, id)); } catch(e){} }
  }
  logIt(S.me + ' removed ' + (doomed.length > 1 ? doomed.length + ' x ' + pool : doomed[0].name),
        { pool: pool, n: doomed.length });
  return doomed.length;
}
async function checkInMany(pool, n){
  const back = S.items.filter(i => poolOf(i) === pool && i.status === 'out' && i.holder === S.me)
                      .slice(0, Math.max(0, n));
  if (!back.length) return 0;
  await putItems(back.map(i => ({ ...i, status:'in', holder:'', holderUid:'', eventId:'', since:'' })));
  logIt(S.me + ' returned ' + (back.length > 1 ? back.length + ' x ' + pool : back[0].name),
        { pool: pool, n: back.length });
  return back.length;
}
async function flagRepair(item, note){
  const next = { ...item, status:'repair', notes: note || item.notes };
  await putItem(next);
  logIt(S.me + ' flagged ' + item.name + ' as a problem' + (note ? ': ' + note : ''), { itemId:item.id });
}

/* ================= render ================= */
function render(){
  if (!S.mode) return;
  const v = $('view'); if (!v) return;
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === S.route.tab ? 'page' : 'false'));
  $('whoBtn').textContent = S.me || 'Who are you?';

  /* the only badge worth interrupting someone for is gear that has not come
     back. Shortage counts used to live here and were pure noise. */
  const badge = document.querySelector('nav.tabs .pip');
  if (badge) badge.remove();
  const nLate = isAdmin() ? overdueItems().length : overdueItems(S.me).length;
  if (nLate) {
    const btn = document.querySelector('nav.tabs button[data-tab=' + (isAdmin() ? 'week' : 'today') + ']');
    if (btn) {
      const p = document.createElement('span');
      p.className = 'pip'; p.textContent = nLate > 9 ? '9+' : nLate;
      btn.appendChild(p);
    }
  }

  let html = '';
  if (S.rulesError) html += ruleBanner();

  const r = S.route;
  if (r.view === 'event') html += viewEvent(r.id);
  else if (r.view === 'pull') html += viewPull(r.id);
  else if (r.view === 'checklist') html += viewChecklist(r.id, r.id2);
  else if (r.view === 'import') html += viewImport();
  else if (r.view === 'kits') html += viewKits();
  else if (r.view === 'inventory') html += viewInventory();
  else if (r.view === 'activity') html += viewActivity();
  else if (r.view === 'setup') html += viewSetup();
  else if (r.view === 'datacheck') html += viewDatacheck();
  else if (r.view === 'addons') html += viewAddons();
  else if (r.tab === 'today') html += viewToday();
  else if (r.tab === 'gear') html += viewGear();
  else if (r.tab === 'week') html += viewWeek();
  else html += viewMore();

  v.innerHTML = html;
  bind();
}
function go(tab, view, id, id2){
  S.route = { tab: tab || S.route.tab, view: view || '', id: id || '', id2: id2 || '' };
  window.scrollTo(0,0);
  render();
}
function backBtn(label, tab){
  return '<button class="back" data-go="' + tab + '">' + esc(label) + '</button>';
}
function ruleBanner(){
  return '<div class="banner warn"><b>Team sync is blocked</b>Firestore is refusing writes, which means the security rules have not been added yet. Your changes are saved on this device but the team will not see them. Open <b>More &gt; Setup</b> for the exact text to paste into Firebase.</div>';
}

/* Collapse a list of units into pools, keeping the order they came in. */
function groupPools(units){
  const seen = {}, out = [];
  units.forEach(i => {
    const p = poolOf(i);
    if (!seen[p]) { seen[p] = { pool: p, units: [] }; out.push(seen[p]); }
    seen[p].units.push(i);
  });
  return out;
}

/* The summary row for "we own 40 of these". Counts come from the WHOLE
   inventory, not the filtered list, because "28 free" has to mean 28 free in
   the warehouse -- not 28 free among the rows that happen to match a search. */
function poolRow(pool, units){
  const all = S.items.filter(x => poolOf(x) === pool && x.status !== 'retired');
  const owned = all.length;
  const free = all.filter(x => x.status === 'in').length;
  const gone = all.filter(x => x.status === 'out').length;
  const rep = all.filter(x => x.status === 'repair').length;
  const bits = [owned + ' owned'];
  if (gone) bits.push(gone + ' out');
  if (rep) bits.push(rep + ' need attention');
  const cls = free ? '' : 'out';
  return '<button class="item ' + cls + '" data-pool="' + esc(pool) + '">'
    + '<span class="nm"><b>' + esc(pool) + '</b><span>' + esc(units[0].category) + ' &middot; '
    + bits.join(' &middot; ') + '</span></span>'
    + '<span class="pill ' + (free ? 'in' : 'out') + '">' + free + ' free</span></button>';
}

function itemRow(i, extra){
  const cls = i.status === 'out' ? 'out' : (i.status === 'repair' ? 'repair' : '');
  let sub = i.category;
  if (i.status === 'out') sub = 'With ' + (i.holder || 'someone') + ' &middot; ' + ago(i.since);
  if (i.status === 'repair') sub = 'Needs attention';
  if (i.status === 'in') sub = i.category + ' &middot; ' + (i.home || '');
  return '<button class="item ' + cls + ' ' + (extra||'') + '" data-item="' + i.id + '">'
    + '<span class="nm"><b>' + esc(i.name) + '</b><span>' + sub + '</span></span>'
    + '<span class="pill ' + i.status + '">' + ({in:'In',out:'Out',repair:'Problem',retired:'Retired'}[i.status]) + '</span>'
    + '</button>';
}

/* ---- GEAR ---- */
function viewGear(){
  const q = S.gearQ.toLowerCase();
  let list = S.items.filter(i => i.status !== 'retired' || S.gearFilter === 'retired');
  if (S.gearFilter === 'in') list = list.filter(i => i.status === 'in');
  if (S.gearFilter === 'out') list = list.filter(i => i.status === 'out');
  if (S.gearFilter === 'repair') list = list.filter(i => i.status === 'repair');
  if (S.gearFilter === 'mine') list = list.filter(i => i.status === 'out' && i.holder === S.me);
  if (S.gearFilter === 'retired') list = list.filter(i => i.status === 'retired');
  if (q) list = list.filter(i => (i.name + ' ' + i.category + ' ' + i.brand + ' ' + i.model + ' ' + i.holder + ' ' + i.serial).toLowerCase().includes(q));

  const nOut = S.items.filter(i => i.status === 'out').length;
  const nRep = S.items.filter(i => i.status === 'repair').length;

  let h = '<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
    + '<input type="text" id="q" placeholder="Search gear, person, serial" value="' + esc(S.gearQ) + '"></div>';
  h += '<div class="chips">';
  [['all','All ' + S.items.filter(i=>i.status!=='retired').length],['mine','Mine'],['out','Out ' + nOut],
   ['in','In stock'],['repair','Problems' + (nRep ? ' ' + nRep : '')],['retired','Retired']]
    .forEach(([k,l]) => { h += '<button class="chip" data-f="' + k + '" aria-pressed="' + (S.gearFilter===k) + '">' + l + '</button>'; });
  h += '</div>';

  if (!list.length) return h + '<div class="empty"><p>Nothing matches.</p></div>';

  const groups = {};
  list.forEach(i => { (groups[i.category] = groups[i.category] || []).push(i); });
  CATEGORIES.concat(Object.keys(groups).filter(c => !CATEGORIES.includes(c)).sort()).forEach(cat => {
    if (!groups[cat]) return;
    h += '<h2 class="sec">' + esc(cat) + '</h2>';
    /* One row per POOL, not per unit. Owning 40 uplights used to mean 40
       near-identical rows filling the whole screen, which is unreadable and
       hides everything else you own. Anything you own exactly one of still
       renders as its own plain row, so the common case is unchanged.
       2026-08-25, the first thing Corey hit after entering real gear. */
    groupPools(groups[cat]).forEach(g => {
      h += g.units.length > 1 ? poolRow(g.pool, g.units) : itemRow(g.units[0]);
    });
  });
  if (canEditGear()) h += '<button class="btn ghost sm" style="width:100%;margin-top:1rem" data-view="inventory">Add or edit gear</button>';
  return h;
}

/* ---- WEEK ---- */
/* The Week tab answers one question: who has what, and is it back yet.
   Shortage arithmetic used to live here with a red badge. It moved to
   More > Check gear data, because until the CRM Systems are dialled in it is a
   data-quality tool, not a wedding-day warning. 2026-08-11. */
function viewWeek(){
  const evs = upcoming(14);
  const wknd = weekendEvents();
  const late = overdueByPerson();
  const lateNames = Object.keys(late);
  let h = '';

  if (lateNames.length) {
    const n = overdueItems().length;

      h += '</div>';

  if (wknd.length) {

      h += '<p class="muted">' + wknd.length + ' event' + (wknd.length>1?'s':'')

    people.forEach(who => {

      h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">'
        + '<b style="font-size:1rem">' + esc(who) + '</b>'
        + '<span class="tiny">' + t.got + ' of ' + t.want + ' picked up</span></div>'
        + '<div class="progress"><i style="width:' + pct + '%"></i></div>'

        + events.map(e => esc(plainDay(e.date)) + ' &middot; ' + esc(evLabel(e))).join('<br>')
        + '</p></div>';
    });
  }

  if (!evs.length) {
    return h + '<div class="empty"><p style="margin:0 0 1rem">Nothing on the books for the next two weeks.</p>'
      + '<button class="btn sm" data-view="import">Load this week from the CRM</button></div>';
  }

  const byDate = {};
  evs.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  h += '<h2 class="sec">Next two weeks</h2>';
  Object.keys(byDate).sort().forEach(d => {
    h += '<p class="tiny" style="margin:.9rem 0 .35rem;font-weight:700">' + esc(prettyDay(d)) + '</p>';
    byDate[d].forEach(e => { h += evCard(e, 0); });
  });
  h += '<button class="btn ghost sm" style="width:100%;margin-top:1rem" data-view="import">Import or add events</button>';
  return h;
}

/* ---- gear data check (was: the shortage tab) ----
   Corey's DJEP setup has holes he wants to close. This app imports Systems,
   Equipment quantities and Events, so it can do the arithmetic and show where
   the CRM data disagrees with reality. That is the useful job for this, not
   crying wolf on a Saturday. */
function dataHoles(){
  const out = [];
  const noSystem = S.items.filter(i => i.status !== 'retired'
    && !S.kits.some(k => (k.items||[]).includes(i.id)));
  if (noSystem.length) {
    const pools = [...new Set(noSystem.map(poolOf))];
    out.push({ t: pools.length + ' pieces of gear are not in any kit',
      d: 'Nothing pulls these automatically for an event. Add them to a kit under More > Kits, '
       + 'or accept they are grab-as-needed.',
      list: pools.slice(0,12) });
  }
  const emptyKits = S.kits.filter(k => !(k.items||[]).length && !k.disabled);
  if (emptyKits.length) {
    out.push({ t: emptyKits.length + ' kits have no gear in them',
      d: 'An event that asks for one of these pulls nothing. Open More > Kits and tick '
       + 'the gear that belongs in it.',
      list: emptyKits.map(k => k.name).slice(0,12) });
  }
  const unknown = [...new Set(S.events.flatMap(e => e.systemIds || [])
    .filter(s => !S.kits.some(k => String(k.sysId) === String(s))))];
  if (unknown.length) {
    out.push({ t: unknown.length + ' System IDs on events have no matching System',
      d: 'Events reference these but the Systems import does not know them. Re-import the Systems report.',
      list: unknown.map(u => 'System ID ' + u) });
  }
  const noQty = S.items.filter(i => i.status !== 'retired' && supplyOf(poolOf(i)) === 1);
  const singles = [...new Set(noQty.map(poolOf))];
  if (singles.length) {
    out.push({ t: singles.length + ' things you only own one of',
      d: 'Worth a look. If you actually own more than one, open it and add the rest, '
       + 'so the app stops warning you about days you can cover.',
      list: singles.slice(0,15) });
  }
  return out;
}

/* ---- EVENT ---- */
function viewEvent(id){
  const e = eventById(id);
  if (!e) return backBtn('Back','week') + '<div class="empty"><p>That event is gone.</p></div>';
  const brand = String(e.brand||'COS').toUpperCase() === 'AE' ? 'ae' : 'cos';
  const req = requiredItemIds(e);
  const loaded = req.filter(x => { const i = itemById(x); return i && i.status === 'out'; }).length;
  const conf = conflictsFor(e);

  let h = backBtn('Back', 'week');
  h += '<h2 class="sec" style="margin-top:.4rem">' + esc(prettyDay(e.date)) + (e.time ? ' &middot; ' + esc(e.time) : '') + '</h2>';
  h += '<div class="card"><div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem">'
    + '<span class="pill ' + brand + '">' + (brand==='ae'?'AE':'COS') + '</span>'
    + (e.dj ? '<span class="pill retired">' + esc(e.dj) + (e.dj2 ? ' + ' + esc(e.dj2) : '') + '</span>' : '') + '</div>';
  h += '<div style="font-size:1.2rem;font-weight:650;letter-spacing:-.01em">' + esc(evLabel(e)) + '</div>';
  h += '<div class="muted">' + esc(e.venue || '') + (e.city ? ', ' + esc(e.city) : '') + '</div>';
  if (e.services) h += '<div class="kv" style="margin-top:.6rem"><span>Services</span><b>' + esc(e.services) + '</b></div>';
  if (e.notes) h += '<div class="kv"><span>Notes</span><b>' + esc(e.notes) + '</b></div>';
  h += '</div>';

  if (conf.length) {
    h += '<div class="banner warn"><b>Short on gear this date</b>'
      + conf.map(c => esc(c.pool) + ': need ' + c.need + ', own ' + c.have).join('<br>')
      + '<br><span class="tiny">Counting every event booked on ' + esc(e.date) + '.</span></div>';
  }

  h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">'
    + '<b style="font-size:.9rem">Pull list</b><span class="tiny">' + loaded + ' of ' + req.length + ' checked out</span></div>'
    + '<div class="progress"><i style="width:' + (req.length?Math.round(loaded/req.length*100):0) + '%"></i></div>'
    + '<div class="row2" style="margin-top:.8rem">'
    + '<button class="btn primary" data-pull="' + e.id + '">Open pull list</button>'
    + '<button class="btn" data-cl="' + e.id + '">Checklists</button></div></div>';

  h += '<h2 class="sec">Kits on this event</h2>';

    h += '<div class="navrow" data-kitinfo="' + k.id + '"><span class="grow">' + esc(k.name)
      + '<br><span class="tiny">' + (k.items||[]).length + ' items</span></span><span class="go"></span></div>';
  });
  h += '<button class="btn ghost sm" style="width:100%;margin-top:.8rem" data-editev="' + e.id + '">Edit this event</button>';
  return h;
}

/* ---- PULL LIST ---- */
/* id is either an event id, or the literal 'weekend' for one warehouse trip.
   Rows are per POOL with a count, not per unit. Corey owns 40 uplights and a
   single event wants 16 of them - forty checkboxes would be unusable, so this
   is a stepper. Rewritten 2026-08-11 once the real inventory arrived. */
function viewPull(id){
  const isWk = id === 'weekend';
  const e = isWk ? null : eventById(id);
  if (!isWk && !e) return backBtn('Back','week') + '<div class="empty"><p>Event not found.</p></div>';

  let need, head, sub, evs;
  if (isWk) {
    const wk = weekendPull(S.me);
    if (!wk.events.length) return backBtn('Back','today') + '<div class="empty"><p>Nothing booked this weekend.</p></div>';
    need = wk.need; evs = wk.events;
    head = 'Warehouse pickup';
    sub = evs.length + ' event' + (evs.length>1?'s':'') + ' &middot; '
        + evs.map(x => esc(evLabel(x))).join(', ')
        + '<br>Back by ' + esc(plainDay(nextMonday(evs[evs.length-1].date))) + '.';
  } else {
    need = poolNeeds(e); evs = [e];
    head = 'Pull list';
    sub = esc(evLabel(e)) + ' &middot; ' + esc(prettyDay(e.date));
  }

  const pools = Object.keys(need).sort();
  let h = backBtn(isWk ? 'Back' : 'Back to event', isWk ? 'today' : ('event:' + e.id));
  h += '<h2 class="sec" style="margin-top:.4rem">' + head + '</h2>';
  h += '<p class="muted" style="margin-top:-.2rem">' + sub + '</p>';

  if (!pools.length) {
    return h + '<div class="empty"><p>No gear matched this event.</p>'
      + '<p class="tiny">If it should have some, check More &gt; Addon mapping.</p></div>';
  }

  const target = isWk ? 'weekend' : e.id;
  const byCat = {};
  pools.forEach(p => {
    const any = S.items.find(i => poolOf(i) === p);
    (byCat[any ? any.category : 'Other'] = byCat[any ? any.category : 'Other'] || []).push(p);
  });

  Object.keys(byCat).sort().forEach(cat => {
    h += '<div class="kitblk"><h4>' + esc(cat) + '</h4>';
    byCat[cat].forEach(p => {
      const want = need[p];
      const have = Math.min(heldCount(p, S.me), want);
      const free = S.items.filter(i => poolOf(i) === p && i.status === 'in').length;
      const owned = S.items.filter(i => poolOf(i) === p && i.status !== 'retired').length;
      const done = have >= want;
      const where = (S.items.find(i => poolOf(i) === p) || {}).home || '';
      let note = where && where.toLowerCase() !== 'none' ? where : '';
      if (!done && free === 0) note = 'None free - all ' + owned + ' are out';
      h += '<div class="check" data-on="' + (done?1:0) + '" style="cursor:default">'
        + '<span class="box"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg></span>'
        + '<span class="txt" style="flex:1">' + esc(p)
        + '<br><span class="tiny">' + have + ' of ' + want + ' taken'
        + (owned > want ? ' &middot; ' + owned + ' owned' : '')
        + (note ? ' &middot; ' + esc(note) : '') + '</span></span>'
        + '<span style="display:flex;align-items:center;gap:.35rem;flex:none">'
        + '<button class="btn sm" data-give="' + esc(p) + '" ' + (have?'':'disabled style="opacity:.35"') + '>&minus;</button>'
        + '<b style="min-width:2.2em;text-align:center;font-size:1rem">' + have + '</b>'
        + '<button class="btn sm" data-take="' + esc(p) + '" data-ev="' + target + '" '
        + ((done||!free)?'disabled style="opacity:.35"':'') + '>+</button>'
        + '</span></div>';
    });
    h += '</div>';
  });

  const tot = pools.reduce((a,p) => a + need[p], 0);
  const mine = pools.reduce((a,p) => a + Math.min(heldCount(p, S.me), need[p]), 0);
  h += '<div class="sticky-act">';
  if (mine < tot) h += '<button class="btn primary" data-pullall="' + target + '">Take everything (' + (tot - mine) + ' left)</button>';
  if (mine) h += '<button class="btn" style="margin-top:.5rem" data-inev="' + target + '">Return all ' + mine + '</button>';
  h += '</div>';
  return h;
}

function viewChecklist(evId, clId){

    });

  const tot = cl.items.length;

  let h = backBtn('All checklists', 'checklist:' + e.id);
  h += '<h2 class="sec" style="margin-top:.4rem">' + esc(cl.name) + '</h2>';

      + esc(cl.id === 'cl_leaving' ? 'Go. Drive safe.' : 'Nothing left on this list.') + '</div></div>';
  } else {
    h += '<div class="progress"><i style="width:' + Math.round(checked.length/tot*100) + '%"></i></div>'
      + '<p class="tiny" style="margin:.3rem 0 1rem">' + checked.length + ' of ' + tot + ' done</p>';
  }

  cl.items.forEach((txt, idx) => {
    const on = checked.includes(idx);
    h += '<button class="check" data-clcheck="' + idx + '" data-cl="' + cl.id + '" data-ev="' + e.id + '" data-on="' + (on?1:0) + '">'

      + '<span class="txt">' + esc(txt) + '</span></button>';
  });
  if (checked.length) h += '<button class="btn ghost sm" style="width:100%;margin-top:1rem" data-clreset="' + cl.id + '" data-ev="' + e.id + '">Reset this list</button>';
  return h;

/* ---- equipment + systems parsing ---- */
const EQUIP_HINTS = {
  name:    ['name'],
  category:['category','type'],
  brand:   ['manufacturer','brand','make'],
  model:   ['model number','model','model #','model no'],
  serial:  ['serial number','serial','serial #','serial no'],
  home:    ['location','stored','storage'],
  qty:     ['quantity available','quantity','qty','available','count'],
  system:  ['system name','system','systems','package'],
  active:  ['is active','active','enabled'],
  eqid:    ['equipment id','equipmentid','id'],
  notes:   ['notes','note'],
  descr:   ['description','desc'],
  value:   ['current value','value'],
  price:   ['purchase price','price','cost'],
  bought:  ['date of purchase','purchase date','purchased'],
  vendor:  ['purchased from','vendor','supplier'],
  insured: ['insured'],
  warranty:['warranty length','warranty'],
  rental:  ['rental fee'],
  addon:   ['addon fee','add-on fee']
};
/* The CRM has TWO separate lists and they are easy to confuse:
     Setup > Equipment  = 12 physical things you own (what the warehouse holds)
     Setup > Add Ons    = 207 sellable line items (what a client can buy)
   Only 13 add-ons are categorised FX / Lighting / Photo Booths, and those
   categories mirror the equipment categories exactly. That category is the
   cleanest signal for "is this addon actually gear, or is it a saxophone
   player". Everything uncategorised is almost always a service. 2026-08-12. */
const GEAR_CATEGORIES = ['fx', 'lighting', 'photo booths', 'photo booth'];
const ADDON_HINTS = {
  name:     ['name','addon name'],
  category: ['category'],
  inactive: ['inactive'],
  price:    ['price'],
  addonId:  ['addon id','addonid']
};
/* THE GOOD ONE. Buried in the addon's Quote Generator Settings blob is
     <ASSIGNED_EQUIPMENT_STAND_ALONE>1=16,6=2,9=4</ASSIGNED_EQUIPMENT_STAND_ALONE>
   which is equipmentId=quantity. DJEP already knows that "Lighting Experience"
   means 16 Uplights + 2 Moving Heads + 4 Tube Lights. That is authoritative and
   beats any name matching we could invent. Found 2026-08-12 in the live export.
   Only the categorised add-ons have it filled in; the rest fall back to the
   name matcher. */
function parseAssignedEquipment(blob){
  const m = String(blob || '').match(/<ASSIGNED_EQUIPMENT_STAND_ALONE>([^<]*)<\/ASSIGNED_EQUIPMENT_STAND_ALONE>/i);
  if (!m || !m[1].trim()) return [];
  return m[1].split(',').map(pair => {
    const [id, qty] = pair.split('=');
    const n = parseInt(qty, 10);
    if (!id || !isFinite(n) || n < 1) return null;
    return { eqId: String(id).trim(), qty: n };
  }).filter(Boolean);
}
function rowsToAddonCatalog(parsed){
  const map = mapHeaders(parsed.head, ADDON_HINTS);
  const qgIdx = parsed.head.indexOf('quote generator settings');
  const rows = parsed.rows.map(r => {
    const g = f => (map[f] !== undefined ? String(r[map[f]] || '').trim() : '');
    const name = g('name');
    if (!name) return null;
    return { name, category: g('category'), inactive: truthy(g('inactive')),
             gear: qgIdx >= 0 ? parseAssignedEquipment(r[qgIdx]) : [] };
  }).filter(Boolean);
  return { map, rows };
}
/* equipment id -> pool name, from whatever the gear import produced */
function poolByEqId(eqId){
  const hit = S.items.find(i => String(i.eqId) === String(eqId));
  return hit ? poolOf(hit) : null;
}
function addonInfo(name){
  return (S.addonCatalog || {})[String(name || '').toLowerCase()] || null;
}
/* true = definitely gear, false = definitely not, null = no catalog opinion */
function addonIsGear(name){
  const info = addonInfo(name);
  if (!info) return null;
  if (!info.category) return null;                      // uncategorised: undecided
  return GEAR_CATEGORIES.includes(info.category.toLowerCase());
}
const SYS_HINTS = {
  name:    ['name','system name'],
  category:['category','type'],
  descr:   ['description','desc'],
  home:    ['location'],
  notes:   ['notes','note'],
  sysid:   ['system id','systemid','id'],
  disabled:['disabled','is disabled']
};
function mapHeaders(head, hints){
  const map = {};
  Object.keys(hints).forEach(f => {
    const i = head.findIndex(h => hints[f].includes(h));
    if (i >= 0) map[f] = i;
  });
  return map;
}
function truthy(v){
  const s = String(v == null ? '' : v).trim().toLowerCase();
  return s === 'true' || s === 'yes' || s === 'y' || s === '1' || s === 'x' || s === 'active';
}
function falsy(v){
  const s = String(v == null ? '' : v).trim().toLowerCase();
  return s === 'false' || s === 'no' || s === 'n' || s === '0';
}
function rowsToEquipment(parsed){
  const map = mapHeaders(parsed.head, EQUIP_HINTS);
  const rows = parsed.rows.map(r => {
    const g = f => (map[f] !== undefined ? String(r[map[f]] || '').trim() : '');
    const name = g('name');
    if (!name) return null;
    let qty = parseInt(g('qty'), 10);
    if (!isFinite(qty) || qty < 1) qty = 1;
    if (qty > 60) qty = 60;                       // a typo like 500 should not create 500 rows
    const activeRaw = g('active');
    return {
      eqid: g('eqid') || ('n' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-')),
      name, qty,
      category: g('category') || 'Uncategorised',
      brand: g('brand'), model: g('model'), serial: g('serial'),
      home: g('home') || 'Not set',
      system: g('system'),
      /* blank Is Active means active - do not retire a whole inventory because
         the column was left out of the report */
      active: activeRaw === '' ? true : !falsy(activeRaw),
      notes: [g('notes'), g('descr')].filter(Boolean).join(' - '),
      extra: { value:g('value'), price:g('price'), bought:g('bought'), vendor:g('vendor'),
               insured:truthy(g('insured')), warranty:g('warranty'),
               rental:g('rental'), addon:g('addon') }
    };
  }).filter(Boolean);
  return { map, rows };
}
/* Expand one CRM row of qty N into N trackable units, because the useful
   question is "who has which one", not "how many are gone". Re-importing
   must never clobber a unit that is currently checked out. */
function equipmentToUnits(rows){
  const units = [], kits = {};
  rows.forEach(r => {
    for (let n = 1; n <= r.qty; n++) {
      const id = 'dj-' + r.eqid + '-' + n;
      const existing = S.items.find(i => i.id === id);
      units.push({
        id,
        eqId: r.eqid,
        name: r.qty > 1 ? r.name + ' ' + n : r.name,
        pool: r.name,                      // supply = the CRM Quantity Available
        category: r.category,
        brand: r.brand, model: r.model,
        serial: n === 1 ? r.serial : '',   // a serial belongs to one physical unit
        home: r.home,
        notes: r.notes,
        crm: r.extra,
        template: false,
        /* preserve anything a person has already done to this unit */
        status: existing ? existing.status : (r.active ? 'in' : 'retired'),
        holder: existing ? existing.holder : '',
        holderUid: existing ? existing.holderUid : '',
        eventId: existing ? existing.eventId : '',
        since: existing ? existing.since : ''
      });
      if (!r.active && !existing) units[units.length-1].status = 'retired';
      /* one unit per equipment row per kit: a System is one deployable package,
         and Quantity Available is how many packages you can field at once */
      if (r.system && n === 1) {
        const kid = 'sys_' + r.system.toLowerCase().replace(/[^a-z0-9]+/g,'_');
        (kits[kid] = kits[kid] || { id: kid, name: r.system, items: [], fromCrm: true }).items.push(id);
      }
    }
  });
  return { units, kits: Object.values(kits) };
}
function rowsToSystems(parsed){
  const map = mapHeaders(parsed.head, SYS_HINTS);
  const rows = parsed.rows.map(r => {
    const g = f => (map[f] !== undefined ? String(r[map[f]] || '').trim() : '');
    const name = g('name');
    if (!name) return null;
    return { name, sysid: g('sysid'), category:g('category'), descr:g('descr'), home:g('home'),
             notes:g('notes'), disabled: truthy(g('disabled')) };
  }).filter(Boolean);
  return { map, rows };
}

  setup:  ['setup time','load in','load-in'],
  endt:   ['end time'],
  brand:  ['brand','company','business'],

  status: ['status'],

/* The CRM Events report exposes gear as System 1..System 10, and they are
   integer System IDs, not names. That is why the Systems report has to be
   imported first - it is the ID to name lookup. Same story for Assigned
   Employee, which is an employee ID. 2026-08-11. */
function systemCols(head){
  const out = [];
  head.forEach((h,i) => { if (/^system\s*\d+$/.test(h)) out.push(i); });
  return out;
}
function addonCols(head){
  const out = [];
  head.forEach((h,i) => { if (/^addon\s*\d+$/.test(h)) out.push(i); });
  return out;
}
/* Addon N pairs with Addon N Quantity. This is the real gear-to-event link in
   Corey's CRM - Systems are unused, but events say things like
   "Uplight x16, Selfie Photo Booth x1". Verified against the live export
   2026-08-11. */
function addonPairs(head){
  const out = [];
  head.forEach((h,i) => {
    const m = h.match(/^addon\s*(\d+)$/);
    if (!m) return;
    out.push({ nameIdx: i, qtyIdx: head.indexOf('addon ' + m[1] + ' quantity') });
  });
  return out;
}
/* "Uplighting (12)" and "Uplights" have to resolve to the same gear, so compare
   stemmed word sets rather than raw strings. */
function stemTokens(s){
  return String(s || '').toLowerCase()
    .replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/).filter(Boolean)

    .filter(w => w.length > 1);
}
/* A count baked into the addon name ("Uplighting (12)") is per-unit, and
   multiplies by the ordered quantity. */
const WORD_NUM = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8,
                   nine:9, ten:10, eleven:11, twelve:12, sixteen:16, twenty:20 };
function countInName(name){
  const s = String(name || '').toLowerCase();
  const paren = s.match(/\((\d+)\)/);
  if (paren) return parseInt(paren[1], 10);
  for (const w in WORD_NUM) if (new RegExp('\\b' + w + '\\b').test(s)) return WORD_NUM[w];
  const trail = s.match(/\b(\d+)\s*$/);
  if (trail) return parseInt(trail[1], 10);
  return 1;
}
/* Best equipment pool for an addon name: every word of the equipment name must
   appear in the addon name, and the most specific winner takes it, so
   "Battery Cold Sparks" does not get grabbed by "Cold Sparks". */
function matchPool(addonName, pools){
  const a = new Set(stemTokens(addonName));
  let best = null, bestLen = 0;
  pools.forEach(p => {
    const t = stemTokens(p);
    if (!t.length || !t.every(w => a.has(w))) return;
    if (t.length > bestLen) { best = p; bestLen = t.length; }
  });
  return best;
}
function allPools(){
  return [...new Set(S.items.filter(i => i.status !== 'retired').map(poolOf))];
}
/* addon list on an event -> { poolName: unitsNeeded } */
function addonNeeds(ev){
  const pools = allPools(), need = {};
  (ev.addons || []).forEach(a => {
    const manual = (S.addonMap || {})[a.name.toLowerCase()];
    if (manual === '') return;                       // told to ignore
    const ordered = a.qty || 1;

    /* 1. the CRM's own equipment assignment. Exact, no guessing. */
    if (!manual) {
      const info = addonInfo(a.name);
      if (info && (info.gear || []).length) {
        info.gear.forEach(g => {
          const pool = poolByEqId(g.eqId);
          if (pool) need[pool] = (need[pool] || 0) + g.qty * ordered;
        });
        return;
      }
      if (addonIsGear(a.name) === false) return;     // catalog says it is a service
    }
    /* 2. fall back to matching on the name */
    const pool = manual || matchPool(a.name, pools);
    if (!pool) return;
    need[pool] = (need[pool] || 0) + countInName(a.name) * ordered;
  });
  return need;
}
function unmatchedAddons(){
  const pools = allPools(), out = {};
  S.events.forEach(e => (e.addons || []).forEach(a => {
    const k = a.name.toLowerCase();
    if ((S.addonMap || {})[k] !== undefined) return;
    const info = addonInfo(a.name);
    if (info && (info.gear || []).length) return;  // CRM already assigns equipment
    if (addonIsGear(a.name) === false) return;     // catalog says service
    if (matchPool(a.name, pools)) return;
    out[a.name] = (out[a.name] || 0) + 1;
  }));
  return out;
}
/* Real statuses in Corey's DJEP, read off the live export 2026-08-11:
     Booked | PIF - Booked | AE - Booked | AE - PIF - Booked
     Quote Sent | Contract Sent | Contract Rcvd - Nd Dep
     Never Booked | AE - Never Booked | Never Did First Call | Cancelled
   Only the four "Booked" variants are real work. Everything else is a lead, and
   pulling gear for a lead would be nonsense. Note "Never Booked" contains the
   word booked, hence the never check first. */
function eventIsLive(status){
  const s = String(status || '').toLowerCase().trim();
  if (!s) return true;                 // no status column: assume it is real
  if (s.includes('never')) return false;
  return s.includes('booked');
}
/* The "AE - " status prefix is how DJEP distinguishes the two businesses. */
function brandFromStatus(status){
  return /^\s*ae\b/i.test(String(status || '')) ? 'AE' : '';
}
/* 1,951 events live in that export. Only bring forward what is still relevant. */
const IMPORT_PAST_DAYS = 14;
/* Full CSV scanner. Splitting on newlines first was wrong: the real DJEP
   Equipment export has line breaks INSIDE quoted Notes fields ("16 Rockville
   Best Par 50\n8 Both Lighting S4"), which turned one piece of gear into three
   broken rows. Found 2026-08-11 against the live export. */
function splitTable(text, delim){
  const rows = []; let f = '', row = [], q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function parsePaste(text){
  text = String(text || '').replace(/^﻿/, '').trim();
  if (!text) return null;
  const firstLine = text.split('\n')[0];
  const delim = (firstLine.match(/\t/g) || []).length >= (firstLine.match(/,/g) || []).length ? '\t' : ',';
  const all = splitTable(text, delim).filter(r => r.length && r.some(c => String(c).trim()));
  if (all.length < 2) return null;
  const head = all[0].map(s => String(s).trim().toLowerCase());
  const rows = all.slice(1).map(r => r.map(c => String(c).trim()));
  const map = mapHeaders(head, HEADER_HINTS);
  if (map.date === undefined) {
    const idx = head.findIndex(h => h.includes('date'));
    if (idx >= 0) map.date = idx;
  }
  return { head, map, rows };
}
function normDate(s){
  s = String(s||'').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let [,a,b,y] = m;
    if (y.length === 2) y = '20' + y;
    return y + '-' + String(a).padStart(2,'0') + '-' + String(b).padStart(2,'0');
  }
  const d = new Date(s);
  if (!isNaN(d)) return ymd(d);
  return '';
}
function guessBrand(row, map){
  const raw = (map.brand !== undefined ? row[map.brand] : '') + ' ' +
              (map.services !== undefined ? row[map.services] : '') + ' ' +
              (map.notes !== undefined ? row[map.notes] : '');
  return /\bae\b|entertainment/i.test(raw) ? 'AE' : 'COS';
}
const isNum = s => /^\d+$/.test(String(s||'').trim());

   id rather than pretending we know who it is */
function staffName(v){
  const s = String(v == null ? '' : v).trim();
  if (!s) return '';
  if (!isNum(s)) return s;
  return (S.staff && S.staff[s]) ? S.staff[s] : 'Employee ' + s;
}
function rowsToEvents(parsed){
  const { map, rows, head } = parsed;
  const sysIdx = systemCols(head || []);
  const addIdx = addonCols(head || []);
  return rows.map(r => {
    const get = f => (map[f] !== undefined ? String(r[map[f]] || '').trim() : '');
    const date = normDate(get('date'));
    if (!date) return null;
    const status = get('status');
    if (!eventIsLive(status)) return null;
    if (dayDiff(date, today()) > IMPORT_PAST_DAYS) return null;

    const systemIds = sysIdx.map(i => String(r[i] || '').trim()).filter(v => v && v !== '0');
    /* Addons carry the gear. Names with quantities, e.g. Uplight x16. Bare
       numeric values are ids with no catalog to resolve them, so skip those. */
    const addons = addonPairs(head || []).map(({nameIdx, qtyIdx}) => {
      const nm = String(r[nameIdx] || '').trim();
      if (!nm || nm === '0' || isNum(nm)) return null;
      const q = parseInt(qtyIdx >= 0 ? r[qtyIdx] : '1', 10);
      return { name: nm, qty: (isFinite(q) && q > 0) ? q : 1 };
    }).filter(Boolean);
    const addonWords = addons.map(a => a.name);
    const services = [get('pkg'), get('services'), ...addonWords, get('descr')]
      .filter(Boolean).join(', ');

    return {
      id: get('eventId') ? 'crm-' + get('eventId') : uid('e'),
      date,
      client: get('client') || get('eventName'),
      venue: get('venue'), city: get('city'),
      dj: staffName(get('dj')), dj2: staffName(get('dj2')),
      dj3: staffName(get('dj3')),
      djRaw: get('dj'), dj2Raw: get('dj2'), dj3Raw: get('dj3'),
      services,
      systemIds, addons,
      time: get('time'), setup: get('setup'), endt: get('endt'),
      notes: [get('notes'), get('room') ? 'Room: ' + get('room') : '',
              get('guests') ? get('guests') + ' guests' : ''].filter(Boolean).join(' - '),
      status, etype: get('etype'),
      brand: brandFromStatus(status) || guessBrand(r, map),
      extraKits: [], source: 'crm',
      imported: new Date().toISOString()
    };
  }).filter(Boolean);
}
function dupeOf(e){

/* REWRITTEN AGAIN 2026-09-23, and this is the shape to keep.

   This screen must NEVER print a full ruleset. One Firebase project has ONE
   ruleset and three apps share it, so a screen that says "replace everything"
   is a loaded gun pointed at the other two. That is not hypothetical: the
   2026-08-11 version of this constant predated The Front Desk, contained no
   leads/holds/tasks rules and ended with a deny-everything catch-all, and it
   got one click from taking 792 live leads offline on 2026-09-23.

   The first fix was to print ALL THREE apps' rules here. That worked but was
   wrong in its own way - it put Kyle's email allowlist inside the gear app,
   which has no business knowing leads exist. Corey called it: the apps should
   not be able to touch each other at all.

   So this is now the gear BLOCK ONLY, to be ADDED rather than pasted over.
   The safety comes from the shape, not from a warning:
     - it cannot contain a Front Desk rule, so it cannot delete one
     - pasted in the wrong place it is a SYNTAX ERROR, and Firebase refuses to
       publish invalid rules - so it fails loudly and harmlessly, where
       "replace everything" failed silently and completely

   The assembled full ruleset lives in ONE place, ~/firestore-rules.txt, and
   that is the only thing that should ever be pasted wholesale.
   render.mjs asserts this screen stays incapable of being a replacement. */
const RULES = `    // ---- Gear Room (the whole team) - added 2026-09-23 ------------------
    match /gear_items/{id}  { allow read, write: if request.auth != null; }
    match /gear_events/{id} { allow read, write: if request.auth != null; }
    match /gear_runs/{id}   { allow read, write: if request.auth != null; }
    match /gear_config/{id} { allow read, write: if request.auth != null; }

    // An audit trail you can edit is not an audit trail. This is the record of
    // who took what, and nobody - not even an admin - can quietly rewrite it.
    match /gear_activity/{id} {
      allow read:   if request.auth != null;
      allow create: if request.auth != null;
      allow update, delete: if false;
    }`;
