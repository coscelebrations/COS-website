/* Backup is a plain JSON file so it can be read, mailed and diffed without the
   app. Restore REPLACES rather than merges: merging two inventories by hand-
   typed name is guesswork, and a wrong guess silently duplicates gear. 2026-09-23. */
function backupBlob(){
  return JSON.stringify({
    _app: 'gear-room', _at: new Date().toISOString(), _build: BUILD,
    items:S.items, events:S.events, kits:S.kits, checklists:S.checklists,
    runs:S.runs, activity:S.activity, staff:S.staff,
    addonMap:S.addonMap, addonCatalog:S.addonCatalog
  }, null, 1);
}
function downloadBackup(){
  try {
    const blob = new Blob([backupBlob()], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gear-room-' + today() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Saved ' + a.download);
  } catch(e){ toast('Could not build the file'); }
}
async function restoreBackup(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ toast('That file is not a Gear Room backup'); return; }
  if (!d || d._app !== 'gear-room') { toast('That file is not a Gear Room backup'); return; }
  const nI = (d.items||[]).length, nE = (d.events||[]).length;
  if (!confirm('This file has ' + nI + ' pieces of gear and ' + nE + ' weddings, saved '
      + (d._at ? d._at.slice(0,10) : 'at an unknown date') + '.\n\nReplace what is on this device?'
      + (S.mode === 'cloud' ? '\n\nYou are signed in, so this replaces it for the whole team.' : ''))) return;
  S.items = d.items || []; S.events = d.events || []; S.kits = d.kits || [];
  S.checklists = (d.checklists && d.checklists.length) ? d.checklists : S.checklists;
  S.runs = d.runs || {}; S.activity = d.activity || []; S.staff = d.staff || {};
  S.addonMap = d.addonMap || {}; S.addonCatalog = d.addonCatalog || {};
  saveLocal(); render();
  if (S.mode === 'cloud') { await seedAll(); await putConfig(); }
  toast('Restored ' + nI + ' gear and ' + nE + ' weddings');
}

/* ---- ADDON MAPPING ----
   Auto-matching gets most of it ("Uplighting (12)" -> 12 Uplights) but names
   like "Gigbar Lighting" vs "Gig Bar Wash" need a human once. Anything set
   here overrides the guess forever. */
function allAddonNames(){
  const seen = {};
  S.events.forEach(e => (e.addons || []).forEach(a => {
    const k = a.name;
    seen[k] = seen[k] || { name: k, events: 0, qty: a.qty || 1 };
    seen[k].events++;
  }));
  return Object.values(seen).sort((a,b) => b.events - a.events);
}
function viewAddons(){
  const pools = allPools().sort();
  const list = allAddonNames();

      + '<button class="btn sm" data-view="import">Go to import</button></div>';
  }
  const auto = list.filter(a => S.addonMap[a.name.toLowerCase()] === undefined && matchPool(a.name, pools));
  const manual = list.filter(a => S.addonMap[a.name.toLowerCase()] !== undefined);

  const sel = (a, cur) => '<select data-addon="' + esc(a.name) + '" style="width:100%;margin-top:.35rem">'
    + '<option value="__auto"' + (cur === undefined ? ' selected' : '') + '>Work it out automatically</option>'
    + '<option value=""' + (cur === '' ? ' selected' : '') + '>Not gear - ignore it</option>'
    + pools.map(p => '<option' + (cur === p ? ' selected' : '') + '>' + esc(p) + '</option>').join('')
    + '</select>';

  const block = (title, arr, note) => {
    if (!arr.length) return '';
    let x = '<h2 class="sec">' + title + '</h2>';
    if (note) x += '<p class="tiny" style="margin:-.3rem 0 .6rem">' + note + '</p>';
    arr.forEach(a => {
      const cur = S.addonMap[a.name.toLowerCase()];

      x += '<div class="card" style="padding:.75rem .9rem"><b style="font-size:.9rem">' + esc(a.name) + '</b>'
        + '<div class="tiny">on ' + a.events + ' event' + (a.events>1?'s':'')
        + (cur === undefined && guess ? ' &middot; reads as ' + esc(guess) + (per>1 ? ' x' + per : '') : '')
        + '</div>' + sel(a, cur) + '</div>';
    });
    return x;
  };
  h += block('Needs a decision (' + none.length + ')', none,
    'Nothing pulls for these. Set any that are actually equipment.');
  h += block('Set by you (' + manual.length + ')', manual, '');
  h += block('Matched automatically (' + auto.length + ')', auto,
    'Change one only if the guess is wrong.');
  return h;
}

/* ================= events / binding ================= */
function bind(){
  const v0 = $('view');
  if (v0) v0.querySelectorAll('[data-assign]').forEach(el => el.onclick = () => assignSheet(null));
  if (v0) v0.querySelectorAll('[data-editassign]').forEach(el => el.onclick = () => assignSheet(eventById(el.dataset.editassign)));
  const v = $('view');

  v.querySelectorAll('[data-go]').forEach(el => el.onclick = () => {
    const t = el.dataset.go;
    if (t.includes(':')) { const [vw,id] = t.split(':'); go(S.route.tab, vw, id); }
    else go(t);
  });
  v.querySelectorAll('[data-view]').forEach(el => el.onclick = () => go(S.route.tab, el.dataset.view));
  v.querySelectorAll('[data-ev]:not([data-toggle]):not([data-clcheck]):not([data-clopen])')
    .forEach(el => el.onclick = () => go('week', 'event', el.dataset.ev));
  v.querySelectorAll('[data-pull]').forEach(el => el.onclick = e => { e.stopPropagation(); go(S.route.tab, 'pull', el.dataset.pull); });
  v.querySelectorAll('[data-cl]:not([data-clcheck]):not([data-clreset])').forEach(el => el.onclick = e => {
    e.stopPropagation(); go(S.route.tab, 'checklist', el.dataset.cl);
  });
  v.querySelectorAll('[data-clopen]').forEach(el => el.onclick = () => {
    S.route = { tab:S.route.tab, view:'checklist', id:el.dataset.ev, id2:el.dataset.clopen };
    window.scrollTo(0,0); render();
  });
  v.querySelectorAll('[data-item]').forEach(el => el.onclick = () => {
    const i = itemById(el.dataset.item); if (i) itemSheet(i);
  });
  v.querySelectorAll('[data-pool]').forEach(el => el.onclick = () => poolSheet(el.dataset.pool));
  v.querySelectorAll('[data-f]').forEach(el => el.onclick = () => { S.gearFilter = el.dataset.f; render(); });

  const q = $('q');
  if (q) {
    q.oninput = () => { S.gearQ = q.value; const p = q.selectionStart; render();
      const q2 = $('q'); if (q2) { q2.focus(); try { q2.setSelectionRange(p,p); } catch(e){} } };
  }

  v.querySelectorAll('[data-take]').forEach(el => el.onclick = async () => {
    const pool = el.dataset.take;
    const unit = S.items.find(i => poolOf(i) === pool && i.status === 'in');
    if (!unit) { toast('None free'); return; }
    let ev = null;
    if (el.dataset.ev === 'weekend') ev = (weekendPull(S.me).why[pool] || [])[0];
    else ev = eventById(el.dataset.ev);
    await checkOut(unit, ev);
  });
  v.querySelectorAll('[data-give]').forEach(el => el.onclick = async () => {
    const pool = el.dataset.give;
    const unit = S.items.find(i => poolOf(i) === pool && i.status === 'out' && i.holder === S.me);
    if (unit) await checkIn(unit);
  });
  v.querySelectorAll('[data-pullall]').forEach(el => el.onclick = async () => {
    const isWk = el.dataset.pullall === 'weekend';
    const ev = isWk ? null : eventById(el.dataset.pullall);
    if (!isWk && !ev) return;
    const wk = isWk ? weekendPull(S.me) : null;
    const need = isWk ? wk.need : poolNeeds(ev);
    let n = 0; const short = [];
    for (const pool of Object.keys(need)) {
      const want = need[pool] - heldCount(pool, S.me);
      for (let k = 0; k < want; k++) {
        const unit = S.items.find(i => poolOf(i) === pool && i.status === 'in');
        if (!unit) { short.push(pool); break; }
        const forEv = isWk ? (wk.why[pool] || [])[0] : ev;
        await putItem({ ...unit, status:'out', holder:S.me, holderUid:S.uid,
                        eventId: forEv ? forEv.id : '', since:new Date().toISOString() });
        n++;
      }
    }
    logIt(S.me + ' picked up ' + n + ' items' + (isWk ? ' for the weekend' : ' for ' + evLabel(ev)));
    toast(n + ' taken' + (short.length ? ', short on ' + short.length : ''));
    if (short.length) setTimeout(() => alert('Not enough free units of:\n\n'
      + [...new Set(short)].join('\n') + '\n\nSort this before you drive off.'), 300);
  });
  v.querySelectorAll('[data-inev]').forEach(el => el.onclick = async () => {
    const isWk = el.dataset.inev === 'weekend';
    const ev = isWk ? null : eventById(el.dataset.inev);
    if (!isWk && !ev) return;
    const list = isWk
      ? S.items.filter(i => i.status === 'out' && i.holder === S.me)
      : S.items.filter(i => i.eventId === ev.id && i.status === 'out' && i.holder === S.me);
    for (const i of list) await putItem({ ...i, status:'in', holder:'', holderUid:'', eventId:'', since:'' });
    logIt(S.me + ' returned ' + list.length + ' items'
      + (isWk ? '' : ' from ' + evLabel(ev)));
    toast(list.length + ' back at the warehouse');
  });
  v.querySelectorAll('[data-inlate]').forEach(el => el.onclick = async () => {
    const list = overdueItems(S.me);
    for (const i of list) await putItem({ ...i, status:'in', holder:'', holderUid:'', eventId:'', since:'' });
    logIt(S.me + ' returned ' + list.length + ' overdue items');
    toast('Checked in. Thanks.');
  });
  v.querySelectorAll('[data-inall]').forEach(el => el.onclick = async () => {
    const list = myOut();
    for (const i of list) await putItem({ ...i, status:'in', holder:'', holderUid:'', eventId:'', since:'' });
    logIt(S.me + ' returned ' + list.length + ' items');
    toast('All back in. Nice.');
  });

  v.querySelectorAll('[data-clcheck]').forEach(el => el.onclick = async () => {
    const idx = Number(el.dataset.clcheck);
    const key = runKey(el.dataset.ev, el.dataset.cl);
    const run = S.runs[key] || { checked: [], event: el.dataset.ev, list: el.dataset.cl, who: S.me };
    const set = new Set(run.checked || []);
    if (set.has(idx)) set.delete(idx); else set.add(idx);
    await putRun(key, { ...run, checked:[...set], who:S.me, at:new Date().toISOString() });
  });
  v.querySelectorAll('[data-clreset]').forEach(el => el.onclick = async () => {
    const key = runKey(el.dataset.ev, el.dataset.clreset);
    await putRun(key, { checked: [], event: el.dataset.ev, list: el.dataset.clreset, who: S.me });
  });
  v.querySelectorAll('[data-editcl]').forEach(el => el.onclick = () => checklistEditSheet());
  v.querySelectorAll('[data-editkit]').forEach(el => el.onclick = () => {
    const k = S.kits.find(x => x.id === el.dataset.editkit); if (k) kitEditSheet(k);
  });
  v.querySelectorAll('[data-kitinfo]').forEach(el => el.onclick = () => {
    const k = S.kits.find(x => x.id === el.dataset.kitinfo); if (!k) return;
    let h = '<h3>' + esc(k.name) + '</h3>';
    (k.items||[]).forEach(id => { const i = itemById(id); if (i) h += itemRow(i); });
    openSheet(h);
  });
  v.querySelectorAll('[data-edititem]').forEach(el => el.onclick = () => itemEditSheet(itemById(el.dataset.edititem)));
  v.querySelectorAll('[data-newitem]').forEach(el => el.onclick = () => itemEditSheet(null));
  /* Wipe the starter gear so you can build the real list from nothing, instead
     of tapping Delete 53 times on a phone.
     Three things this deliberately does NOT do:
       - it never touches an item you have edited. Saving stamps template:false,
         so anything you renamed is yours and survives.
       - it never touches anything checked out or flagged. Deleting gear that is
         physically in someone's van loses who has it.
       - it does not just filter the local array. In cloud mode the next
         onSnapshot would put all 53 straight back and the button would look
         broken, so the Firestore docs get deleted for real. */
  v.querySelectorAll('[data-clearseed]').forEach(el => el.onclick = async () => {
    const doomed = S.items.filter(i => i.template && i.status === 'in');
    const kept = S.items.filter(i => i.template && i.status !== 'in').length;
    if (!doomed.length) { toast('Nothing left to clear'); return; }
    if (!confirm('Delete ' + doomed.length + ' starter items and start from an empty gear list?'
      + (kept ? '\n\n' + kept + ' are checked out or flagged and will be kept.' : '')
      + '\n\nAnything you have already renamed is kept.')) return;
    const gone = new Set(doomed.map(i => i.id));
    S.items = S.items.filter(i => !gone.has(i.id));
    /* the seed kits point at these ids; leaving them makes viewKits render raw
       ids like "i012" as if they were gear names */
    S.kits.forEach(k => { k.items = (k.items||[]).filter(x => !gone.has(x)); });
    saveLocal(); render();
    if (S.mode === 'cloud' && db) {
      for (const id of gone) { try { await deleteDoc(doc(db, C.items, id)); } catch(e){} }
      await putConfig();
    }
    toast('Cleared. Add your real gear.');
  });
  v.querySelectorAll('[data-editev]').forEach(el => el.onclick = () => eventEditSheet(eventById(el.dataset.editev)));
  v.querySelectorAll('[data-addmanual]').forEach(el => el.onclick = () => eventEditSheet(null));
  v.querySelectorAll('[data-changeme]').forEach(el => el.onclick = () => whoSheet());
  v.querySelectorAll('[data-signout]').forEach(el => el.onclick = () => signOut(auth));
  v.querySelectorAll('[data-tocloud]').forEach(el => el.onclick = () => {
    localStorage.removeItem('gearroom.mode'); location.reload();
  });
  v.querySelectorAll('[data-copyrules]').forEach(el => el.onclick = async () => {
    try { await navigator.clipboard.writeText(RULES); toast('Rules copied'); }
    catch(e){ const b = $('rulesBox'); b.select(); toast('Select all and copy'); }
  });
  v.querySelectorAll('[data-backup]').forEach(el => el.onclick = () => downloadBackup());
  v.querySelectorAll('[data-reupload]').forEach(el => el.onclick = () => seedAll());
  /* The input is built on demand rather than living in the markup, because
     render() rebuilds #view and would drop a half-picked file anyway. */
  v.querySelectorAll('[data-restore]').forEach(el => el.onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => restoreBackup(String(r.result || ''));
      r.onerror = () => toast('Could not read that file');
      r.readAsText(f);
    };
    inp.click();
  });
  v.querySelectorAll('[data-addon]').forEach(el => el.onchange = async () => {
    const k = el.dataset.addon.toLowerCase();
    if (el.value === '__auto') delete S.addonMap[k];
    else S.addonMap[k] = el.value;
    await putConfig();
    toast(el.value === '__auto' ? 'Back to automatic' : (el.value ? 'Set to ' + el.value : 'Ignored'));
  });
  v.querySelectorAll('[data-imode]').forEach(el => el.onclick = () => {
    S.importMode = el.dataset.imode; S.rawImport = null; S.rawName = ''; render();
  });
  v.querySelectorAll('[data-pickfile]').forEach(el => el.onclick = () => {
    const f = $('csvFile'); if (f) f.click();
  });
  v.querySelectorAll('[data-clearfile]').forEach(el => el.onclick = () => {
    S.rawImport = null; S.rawName = ''; render();
  });
  const fileEl = $('csvFile');
  if (fileEl) fileEl.onchange = () => {
    const f = fileEl.files && fileEl.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { S.rawImport = String(rd.result || ''); S.rawName = f.name; render(); };
    rd.onerror = () => toast('Could not read that file');

  };
  const noRead = () => { $('prev').innerHTML = '<div class="banner warn"><b>Nothing to read</b>'
    + 'Paste at least a heading row and one data row.</div>'; };
  v.querySelectorAll('[data-parse]').forEach(el => el.onclick = () => {
    const parsed = parsePaste(importText());
    if (!parsed) return noRead();
    renderPreview(rowsToEvents(parsed), parsed);
  });
  v.querySelectorAll('[data-parseeq]').forEach(el => el.onclick = () => {
    const parsed = parsePaste(importText());
    if (!parsed) return noRead();
    previewEquipment(parsed);
  });
  v.querySelectorAll('[data-parseaddons]').forEach(el => el.onclick = () => {
    const parsed = parsePaste(importText());
    if (!parsed) return noRead();
    previewAddonCatalog(parsed);
  });
  v.querySelectorAll('[data-parsesys]').forEach(el => el.onclick = () => {
    const parsed = parsePaste(importText());
    if (!parsed) return noRead();
    previewSystems(parsed);
  });
  v.querySelectorAll('[data-clearpast]').forEach(el => el.onclick = async () => {
    const cutoff = dayDiff.bind(null);
    const old = S.events.filter(e => dayDiff(e.date, today()) > 30);
    if (!old.length) { toast('Nothing older than 30 days'); return; }
    if (!confirm('Remove ' + old.length + ' past events?')) return;
    for (const e of old) await delEvent(e.id);
    toast(old.length + ' removed');
  });
  const prev = $('prev');
  if (prev) {
    const staffBtn = prev.querySelector('[data-savestaff]');
    if (staffBtn) staffBtn.onclick = async () => {
      S.staff = S.staff || {};
      let n = 0;
      prev.querySelectorAll('[data-staffid]').forEach(sel => {
        if (sel.value) { S.staff[sel.dataset.staffid] = sel.value; n++; }
      });
      await putConfig();
      /* re-run the preview so the names show up before importing */
      const parsed = parsePaste(importText());
      if (parsed) renderPreview(rowsToEvents(parsed), parsed);
      toast(n + ' name' + (n===1?'':'s') + ' saved');
    };

    const eqBtn = prev.querySelector('[data-doeq]');
    if (eqBtn) eqBtn.onclick = async () => {
      const { units, kits } = prev._eq || {};
      if (!units) return;
      const incoming = new Set(units.map(u => u.id));
      /* keep anything checked out or flagged even if it fell off the report -
         losing track of a speaker that is in someone's van is the one
         unrecoverable mistake this app can make */
      const orphans = S.items
        .filter(i => !incoming.has(i.id) && (i.status === 'out' || i.status === 'repair'))
        .map(i => ({ ...i, notes: (i.notes ? i.notes + ' - ' : '') + 'not on the latest CRM equipment report' }));
      S.items = units.concat(orphans);

      const byId = {};
      S.kits.filter(k => !k.fromCrm).forEach(k => { byId[k.id] = k; });
      kits.forEach(k => {
        const old = S.kits.find(x => x.id === k.id);
        byId[k.id] = { ...k, always: old ? old.always : false, note: old ? old.note : '' };
      });
      S.kits = Object.values(byId).filter(k => (k.items||[]).length || !k.fromCrm);

      saveLocal(); render();
      if (S.mode === 'cloud' && db) {
        for (const i of S.items) await cloudSet(C.items, i.id, i);
        await putConfig();
      }
      logIt(S.me + ' imported ' + units.length + ' units and ' + kits.length + ' kits from the CRM');
      toast(units.length + ' units in' + (orphans.length ? ', ' + orphans.length + ' kept' : ''));
      go('gear');
    };

    const adBtn = prev.querySelector('[data-doaddons]');
    if (adBtn) adBtn.onclick = async () => {
      const rows = prev._addons || [];
      const cat = {};
      rows.forEach(r => { cat[r.name.toLowerCase()] = { category: r.category, inactive: r.inactive }; });
      S.addonCatalog = cat;
      await putConfig();
      logIt(S.me + ' imported ' + rows.length + ' add-ons from the CRM');
      toast(rows.length + ' add-ons loaded');
      go('more', 'addons');
    };

    const sysBtn = prev.querySelector('[data-dosys]');
    if (sysBtn) sysBtn.onclick = async () => {
      const rows = prev._sys || [];
      rows.forEach(r => {
        const kid = 'sys_' + r.name.toLowerCase().replace(/[^a-z0-9]+/g,'_');
        const old = S.kits.find(k => k.id === kid || k.name.toLowerCase() === r.name.toLowerCase());
        const next = { id: old ? old.id : kid, name: r.name, items: old ? (old.items||[]) : [],
                       note: r.descr || (old ? old.note : ''), always: old ? old.always : false,
                       /* the whole reason Systems must be imported: this is what
                          System 1..10 on the Events report point at */
                       sysId: r.sysid || (old ? old.sysId : ''),
                       fromCrm: true, disabled: r.disabled };
        if (old) S.kits[S.kits.indexOf(old)] = next; else S.kits.push(next);
      });
      await putConfig();
      logIt(S.me + ' applied ' + rows.length + ' systems from the CRM');
      toast(rows.length + ' systems applied');
      go('more', 'kits');
    };

    const btn = prev.querySelector('[data-doimport]');
    if (btn) btn.onclick = async () => {
      const evs = prev._evs || [];
      let n = 0;
      for (const e of evs) {
        if (S.events.some(x => x.date === e.date && x.client === e.client && x.venue === e.venue)) continue;
        await putEvent(e); n++;
      }
      logIt(S.me + ' imported ' + n + ' events from the CRM');
      toast(n + ' events imported');
      go('week');
    };
  }
}

/* A select whose last option is "Add a new one..." plus a hidden text input.
   Returns the typed value when that option is picked, otherwise the select.
   Never lets the literal '__new' reach an item -- fall back rather than store
   a sentinel that would then show up as a category called "__new". */
function pickOrNew(selId, inputId, fallback){
  const sel = $(selId), txt = $(inputId);
  if (!sel) return fallback;
  if (sel.value !== '__new') return sel.value;
  const typed = txt ? (txt.value || '').trim() : '';
  return typed || fallback;
}

function bindSheet(){
  const s = $('sheetBody');
  const draft = () => $('sheet')._draft;

  /* quantity stepper -- clamped the same 1..60 as the CRM importer, so a
     fat-fingered 500 cannot mint 500 documents */
  s.querySelectorAll('[data-qstep]').forEach(el => el.onclick = () => {
    const box = $('fQty'); if (!box) return;
    const n = Math.max(1, Math.min(60, (Math.round(Number(box.value) || 1)) + Number(el.dataset.qstep)));
    box.value = n;
    if (box.oninput) box.oninput();
  });

  /* the per-unit rows inside the pool sheet. bind() only reaches the main view,
     so without this, tapping a single uplight from inside the pool does nothing */
  s.querySelectorAll('[data-item]').forEach(el => el.onclick = () => {
    const i = itemById(el.dataset.item); if (i) itemSheet(i);
  });

  /* the take / bring-back counters on a pool. Label updates in place rather
     than re-rendering the sheet -- openSheet() re-runs bindSheet, which would
     throw the count away on every tap. */
  const stepper = (btnAttr, boxId, lblId, word) => {
    const box = $(boxId), lbl = $(lblId);
    if (!box) return;
    const sync = () => {
      const max = Number(box.max) || 1;
      const n = Math.max(1, Math.min(max, Math.round(Number(box.value) || 1)));
      box.value = n;
      /* three labels now, not two -- 'gone' was added with the remove control
         2026-09-23 and would otherwise have read "Check 40 back in" on a
         delete button, which is the worst possible wrong label. */
      if (lbl) lbl.textContent = word === 'take' ? 'Take ' + n
                              : word === 'gone' ? 'Remove ' + n
                              : 'Check ' + n + ' back in';
    };
    s.querySelectorAll('[' + btnAttr + ']').forEach(el => el.onclick = () => {
      box.value = (Math.round(Number(box.value) || 1)) + Number(el.getAttribute(btnAttr));
      sync();
    });
    box.oninput = sync;
    sync();
  };
  stepper('data-pstep', 'pQty', 'pTakeLbl', 'take');
  stepper('data-rstep', 'rQty', 'pBackLbl', 'back');
  stepper('data-xstep', 'xQty', 'pGoneLbl', 'gone');

  s.querySelectorAll('[data-removepool]').forEach(el => el.onclick = async () => {
    const pool = el.dataset.removepool;
    const want = $('xQty') ? Math.max(1, Math.round(Number($('xQty').value) || 1)) : 1;
    const held = S.items.filter(i => poolOf(i) === pool && i.status === 'out' && i.holder !== S.me).length;
    if (!confirm('Delete ' + want + ' x ' + pool + ' for good?'
        + '\n\nThe highest-numbered ones go first.'
        + (held ? '\n\n' + held + ' are out with someone else and will be kept.' : '')
        + '\n\nThis cannot be undone.')) return;
    const got = await removeUnits(pool, want);
    closeSheet();
    if (!got) toast('Nothing could be removed');
    else if (got < want) toast('Removed ' + got + ' - that was all that could go');
    else toast(got > 1 ? 'Removed ' + got + ' x ' + pool : 'Removed');
  });

  s.querySelectorAll('[data-takepool]').forEach(el => el.onclick = async () => {
    const pool = el.dataset.takepool;
    const want = $('pQty') ? Math.max(1, Math.round(Number($('pQty').value) || 1)) : 1;
    /* re-check at the moment of the tap: a teammate's checkout can land through
       onSnapshot while this sheet is sitting open, and promising 12 then taking
       8 silently is worse than saying so */
    const got = await checkOutMany(pool, want);
    closeSheet();
    if (!got) toast('None were free');
    else if (got < want) toast('Took ' + got + ' - that was all that was free');
    else toast(got > 1 ? 'Took ' + got + ' x ' + pool : 'Checked out to you');
  });
  s.querySelectorAll('[data-givepool]').forEach(el => el.onclick = async () => {
    const pool = el.dataset.givepool;
    const who = $('pGive') ? $('pGive').value : '';
    if (!who) { toast('Pick a person first'); return; }
    const want = $('pQty') ? Math.max(1, Math.round(Number($('pQty').value) || 1)) : 1;
    const got = await checkOutMany(pool, want, who);
    closeSheet();
    if (!got) toast('None were free');
    else if (got < want) toast('Gave ' + who + ' ' + got + ' - that was all that was free');
    else toast(got > 1 ? who + ' now has ' + got + ' x ' + pool : 'Now with ' + who);
  });
  s.querySelectorAll('[data-returnpool]').forEach(el => el.onclick = async () => {
    const pool = el.dataset.returnpool;
    const want = $('rQty') ? Math.max(1, Math.round(Number($('rQty').value) || 1)) : 1;
    const got = await checkInMany(pool, want);
    closeSheet();
    toast(got > 1 ? got + ' x ' + pool + ' back in stock' : 'Back in stock');
  });

  /* reveal the "new category" / "new spot" box only when asked for */
  [['fCat','fCatNew'],['fHome','fHomeNew']].forEach(pair => {
    const sel = $(pair[0]), txt = $(pair[1]);
    if (!sel || !txt) return;
    sel.onchange = () => {
      txt.style.display = sel.value === '__new' ? 'block' : 'none';
      if (sel.value === '__new') txt.focus();
    };
  });

  /* Fill "Counts as" from the name as it is typed, so the pool is right
     without Corey ever opening the advanced box. Once he edits it himself,
     stop touching it. */
  const nameBox = $('fName'), poolBox = $('fPool'), qtyHint = $('fQtyHint');
  if (nameBox && poolBox) {
    poolBox.oninput = () => { $('sheet')._pooltouched = true; };
    const sync = () => {
      const nm = (nameBox.value || '').trim();
      if (!$('sheet')._pooltouched) poolBox.value = nm ? (derivePool(nm) || nm) : '';
      if (qtyHint) {
        const pool = (poolBox.value || '').trim();
        const have = pool ? supplyOf(pool) : 0;
        const qty = $('fQty') ? Math.max(1, Math.min(60, Math.round(Number($('fQty').value) || 1))) : 1;
        qtyHint.innerHTML = have
          ? 'You already own ' + have + ' ' + esc(pool) + '. ' + (qty > 1 ? 'These get numbered ' : 'This one gets numbered ')
            + (have + 1) + (qty > 1 ? ' and up.' : '.')
          : 'Enter 40 once instead of typing 40 uplights. They get numbered for you and counted as one pool.';
      }
    };
    nameBox.oninput = sync;
    if ($('fQty')) $('fQty').oninput = sync;
  }

  s.querySelectorAll('[data-sout]').forEach(el => el.onclick = async () => {
    await checkOut(itemById(el.dataset.sout), null); closeSheet(); toast('Checked out to you');
  });
  s.querySelectorAll('[data-addrow]').forEach(el => el.onclick = () => {
    const d = assignRead(); if (!d) return;
    d.rows.push({ pool:'', qty:1 });
    $('sheetBody').innerHTML = assignSheetHtml(d);
    bindSheet();
  });
  s.querySelectorAll('[data-saveassign]').forEach(el => el.onclick = () => assignSave());
  s.querySelectorAll('[data-delassign]').forEach(el => el.onclick = async () => {
    if (!confirm('Delete this? The gear stays in your list - this only removes the note that someone needs it.')) return;
    await delEvent(el.dataset.delassign);
    closeSheet(); toast('Removed');
  });
  s.querySelectorAll('[data-giveitem]').forEach(el => el.onclick = async () => {
    const who = $('fGive') ? $('fGive').value : '';
    if (!who) { toast('Pick a person first'); return; }
    await checkOut(itemById(el.dataset.giveitem), null, who);
    closeSheet(); toast('Now with ' + who);
  });
  s.querySelectorAll('[data-sin]').forEach(el => el.onclick = async () => {
    await checkIn(itemById(el.dataset.sin)); closeSheet(); toast('Back in stock');
  });
  s.querySelectorAll('[data-sflag]').forEach(el => el.onclick = () => flagSheet(itemById(el.dataset.sflag)));
  s.querySelectorAll('[data-doflag]').forEach(el => el.onclick = async () => {
    await flagRepair(itemById(el.dataset.doflag), ($('fIssue').value || '').trim());
    closeSheet(); toast('Flagged. Nobody will grab it by mistake.');
  });
  s.querySelectorAll('[data-saveitem]').forEach(el => el.onclick = async () => {
    const v = draft();
    const name = ($('fName').value || '').trim();
    /* used to fall back to 'Untitled', which with a quantity box means forty
       rows called Untitled 1..40 and no way to tell what you meant */
    if (!name) { toast('Give it a name first'); $('fName').focus(); return; }
    const isNew = !S.items.some(x => x.id === v.id);
    const next = { ...v, name: name,
      category: pickOrNew('fCat', 'fCatNew', v.category || CATEGORIES[0]),
      brand: $('fBrand').value.trim(), model: $('fModel').value.trim(),
      serial: $('fSerial').value.trim(),
      home: pickOrNew('fHome', 'fHomeNew', v.home || HOMES[0]),
      notes: $('fNotes').value.trim(),
      status: $('fStatus') ? $('fStatus').value : (v.status || 'in'), template: false };
    next.pool = ($('fPool').value || '').trim() || derivePool(next.name) || next.name;
    if (next.status !== 'out') { next.holder=''; next.holderUid=''; next.eventId=''; next.since=''; }
    /* flipping an existing item to "Checked out" by hand used to leave since
       empty, and dueFor() needs a since -- the thing was then out forever and
       never showed up as overdue. Stamp it to whoever is doing the flipping. */
    else if (!next.since) { next.holder = next.holder || S.me; next.holderUid = next.holderUid || S.uid; next.since = new Date().toISOString(); }

    if (isNew) {
      const qty = $('fQty') ? Math.max(1, Math.min(60, Math.round(Number($('fQty').value) || 1))) : 1;
      if (qty > 24 && !confirm('Add ' + qty + ' separate ' + next.pool + ' units?')) return;
      const units = manualUnits(next, qty, S.items);
      await putItems(units);
      closeSheet();
      toast(units.length > 1 ? 'Added ' + units.length + ' x ' + next.pool : 'Saved');
      return;
    }
    await putItem(next); closeSheet(); toast('Saved');
  });
  s.querySelectorAll('[data-delitem]').forEach(el => el.onclick = async () => {
    if (!confirm('Delete this item for good? Retiring it keeps the history.')) return;
    const id = el.dataset.delitem;
    S.items = S.items.filter(i => i.id !== id);
    S.kits.forEach(k => { k.items = (k.items||[]).filter(x => x !== id); });
    saveLocal(); render();
    if (S.mode === 'cloud' && db) { try { await deleteDoc(doc(db, C.items, id)); } catch(e){} await putConfig(); }
    closeSheet(); toast('Deleted');
  });
  s.querySelectorAll('[data-saveev]').forEach(el => el.onclick = async () => {
    const v = draft();
    await putEvent({ ...v,
      date: $('eDate').value || today(), time: $('eTime').value.trim(), brand: $('eBrand').value,
      client: $('eClient').value.trim(), venue: $('eVenue').value.trim(), city: $('eCity').value.trim(),
      dj: $('eDj').value.trim(), dj2: $('eDj2').value.trim(),
      services: $('eSvc').value.trim(), notes: $('eNotes').value.trim() });
    closeSheet(); toast('Saved');
  });
  s.querySelectorAll('[data-delev]').forEach(el => el.onclick = async () => {
    if (!confirm('Delete this event?')) return;
    await delEvent(el.dataset.delev); closeSheet(); go('week');
  });
  s.querySelectorAll('[data-setme]').forEach(el => el.onclick = () => { setMe(el.dataset.setme); closeSheet(); });
  s.querySelectorAll('[data-setmefree]').forEach(el => el.onclick = () => {
    const n = ($('fWho').value || '').trim(); if (n) { setMe(n); closeSheet(); }
  });
  s.querySelectorAll('[data-kitalways]').forEach(el => el.onclick = async () => {
    const k = S.kits.find(x => x.id === el.dataset.kitalways); if (!k) return;
    k.always = !k.always;
    el.setAttribute('data-on', k.always ? '1' : '0');
    await putConfig();
    toast(k.name + (k.always ? ' goes to every event' : ' only when named'));
  });
  s.querySelectorAll('[data-kititem]').forEach(el => el.onclick = async () => {
    const k = S.kits.find(x => x.id === el.dataset.kit); if (!k) return;
    const id = el.dataset.kititem;
    k.items = k.items || [];
    if (k.items.includes(id)) k.items = k.items.filter(x => x !== id);
    else k.items.push(id);
    el.setAttribute('data-on', k.items.includes(id) ? '1' : '0');
    await putConfig();
  });
  s.querySelectorAll('[data-saveclt]').forEach(el => el.onclick = async () => {
    s.querySelectorAll('[data-cltext]').forEach(ta => {
      const cl = S.checklists.find(c => c.id === ta.dataset.cltext);
      if (cl) cl.items = ta.value.split('\n').map(x => x.trim()).filter(Boolean);
    });
    await putConfig(); closeSheet(); toast('Checklists updated');
  });
}

function setMe(name){
  S.me = name;
  localStorage.setItem('gearroom.me', name);
  render();
  toast('Hey ' + name);
}

/* ================= cloud sync ================= */
let unsubs = [];
function stopSync(){ unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; }
function startSync(){
  if (!db) return;               // firebase has not finished loading yet
  stopSync();
  setDot('syncing');
  const onErr = e => {
    if (String(e.code||'').includes('permission')) { S.rulesError = true; setDot('error'); render(); }
    else setDot('offline');
  };
  /* FIXED 2026-09-23. Events, runs and activity used to assign UNCONDITIONALLY,
     including on an empty snapshot -- so the first cloud sign-in on a phone
     holding hand-entered data wiped every event, checklist run and activity
     line, and seedCloud only ever uploaded items, so they were not in the cloud
     either. That is the bug that would have eaten a hand-entered season.

     A plain `if (!snap.empty)` guard is NOT the fix. It makes deleting your
     LAST row un-propagatable, because every other client reads the resulting
     empty snapshot as "nobody has seeded yet" and pushes its copy back up.
     gear_items has had exactly that latent bug since 2026-08-11.

     So: distinguish the FIRST empty snapshot (nothing up there yet -> push
     ours) from a later one (someone really did delete the last row -> follow
     it). `seeding` stops an empty snapshot that arrives mid-upload from
     deleting the very rows we are in the middle of writing. */
  let firstItems = true, firstEvents = true, firstRuns = true, seeding = false;
  const seedOnce = fn => { seeding = true; Promise.resolve(fn()).catch(()=>{}).then(() => { seeding = false; }); };

  unsubs.push(onSnapshot(collection(db, C.items), snap => {
    /* Only push up a list somebody has actually touched. Before this guard, the
       first teammate to sign in on a fresh phone -- still holding the untouched
       53-item starter template -- published that template as the TEAM's shared
       inventory, and it then overwrote everyone. If everyone is still on pure
       template the cloud just stays empty until the first real edit seeds it. */
    if (!snap.empty) S.items = snap.docs.map(d => d.data());
    else if (firstItems && S.items.some(i => !i.template)) seedOnce(seedCloud);
    else if (!firstItems && !seeding) S.items = [];
    firstItems = false;
    S.rulesError = false; setDot('synced'); render();
  }, onErr));
  unsubs.push(onSnapshot(collection(db, C.events), snap => {
    if (!snap.empty) S.events = snap.docs.map(d => d.data());
    else if (firstEvents && S.events.length) seedOnce(seedEvents);
    else if (!firstEvents && !seeding) S.events = d.events || [];
    firstEvents = false;
    render();
  }, onErr));
  unsubs.push(onSnapshot(collection(db, C.runs), snap => {
    if (!snap.empty) { const r = {}; snap.docs.forEach(d => { r[d.id] = d.data(); }); S.runs = r; }
    else if (firstRuns && Object.keys(S.runs).length) seedOnce(seedRuns);
    else if (!firstRuns && !seeding) S.runs = d.runs || {};
    firstRuns = false;
    render();
  }, onErr));
  unsubs.push(onSnapshot(doc(db, C.config, 'main'), d => {
    const v = d.data();
    if (v && v.kits) S.kits = v.kits;
    if (v && v.checklists) S.checklists = v.checklists;
    if (v && v.staff) S.staff = v.staff;
    if (v && v.addonMap) S.addonMap = v.addonMap;
    if (v && v.addonCatalog) S.addonCatalog = v.addonCatalog;
    render();
  }, onErr));
  /* Activity is append-only history. Keep what this device already has if the
     cloud has none yet, but never upload it -- it is not worth the writes and
     it would double up once teammates sync. 2026-09-23. */
  unsubs.push(onSnapshot(query(collection(db, C.activity), orderBy('at','desc'), limit(80)), snap => {
    if (!snap.empty) S.activity = snap.docs.map(d => d.data());
    render();
  }, () => {}));
}
/* Push a list up one document at a time and report honestly.
   FIXED 2026-09-23: seedCloud used to `return` on the FIRST failed write, with
   no toast, no retry and no log line -- so a flaky signal half-way through 300
   items left a half-populated collection that then became the team's truth,
   and looked identical to success. Count what actually landed and say so. */
async function seedMany(col, rows, label){
  let ok = 0;
  for (const r of rows) { try { await setDoc(doc(db, col, r.id), r); ok++; } catch(e){} }
  if (rows.length && ok < rows.length)
    toast('Only ' + ok + ' of ' + rows.length + ' ' + label + ' uploaded - check your signal, then More > Setup > Re-upload');
  return ok;
}
async function seedCloud(){
  /* first person to sign in populates the shared inventory */
  if (!db) return;
  await seedMany(C.items, S.items, 'gear');
  try { await setDoc(doc(db, C.config, 'main'), { kits:S.kits, checklists:S.checklists, staff:S.staff, addonMap:S.addonMap, addonCatalog:S.addonCatalog }); }
  catch(e){ toast('Gear went up but the kits and checklists did not - try Re-upload in Setup'); }
}
async function seedEvents(){
  if (!db) return;
  await seedMany(C.events, S.events, 'events');
}
async function seedRuns(){
  if (!db) return;
  const keys = Object.keys(S.runs);
  let ok = 0;
  for (const k of keys) { try { await setDoc(doc(db, C.runs, k), S.runs[k]); ok++; } catch(e){} }
  if (keys.length && ok < keys.length)
    toast('Only ' + ok + ' of ' + keys.length + ' checklists uploaded - try Re-upload in Setup');
}
/* Everything this device holds, on demand. The listeners only seed on a FIRST
   empty snapshot, so without this a half-finished upload has no second chance. */
async function seedAll(){
  if (!db) { toast('Not signed in - nothing to upload to'); return; }
  setDot('syncing');
  await seedCloud(); await seedEvents(); await seedRuns();
  setDot('synced');
  toast('Re-uploaded ' + S.items.length + ' gear and ' + S.events.length + ' events');
}

/* ================= boot ================= */
function startApp(mode){
  S.mode = mode;
  const d = loadLocal();
  S.items = d.items; S.events = d.events; S.kits = d.kits;
  S.checklists = d.checklists; S.runs = d.runs; S.activity = d.activity; S.staff = d.staff || {}; S.addonMap = d.addonMap || {}; S.addonCatalog = d.addonCatalog || {};
  S.me = localStorage.getItem('gearroom.me') || '';
  /* ?tab=week / ?view=import open straight to a screen - handy for a
     "go do this" text to the team */
  const qs = new URLSearchParams(location.search);
  const qTab = qs.get('tab'), qView = qs.get('view'), qMode = qs.get('mode');
  if (['today','gear','week','more'].includes(qTab)) S.route.tab = qTab;
  if (['import','kits','inventory','activity','setup','datacheck','addons'].includes(qView)) S.route.view = qView;
  if (['events','equipment','systems'].includes(qMode)) S.importMode = qMode;
  $('gate').classList.add('hide');
  $('app').classList.remove('hide');
  setDot(mode === 'cloud' ? 'syncing' : 'offline');
  if (mode === 'cloud') startSync();
  render();
  if (!S.me) setTimeout(whoSheet, 400);
}

document.querySelectorAll('nav.tabs button').forEach(b =>
  b.onclick = () => go(b.dataset.tab));
$('whoBtn').onclick = whoSheet;
$('scrim').onclick = closeSheet;

$('gSignIn').onclick = async () => {
  const em = $('gEmail').value.trim(), pw = $('gPass').value;
  if (!em || !pw) { $('gErr').textContent = 'Email and password, please.'; return; }
  $('gErr').textContent = ''; $('gSignIn').textContent = 'Signing in...';
  try {
    await ensureFb();
    await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) {
    $('gSignIn').textContent = 'Sign in';
    const code = e.code || '';
    if (!code) $('gErr').textContent = 'No connection. You can still tap "Use on this device only".';
    else $('gErr').textContent = /invalid|wrong|not-found/i.test(code)
      ? 'That email and password did not match.' : 'Could not sign in. ' + code;
  }
};
$('gPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('gSignIn').click(); });
$('gReset').onclick = async () => {
  const em = $('gEmail').value.trim();
  if (!em) { $('gErr').textContent = 'Put your email in first.'; return; }
  try { await ensureFb(); await sendPasswordResetEmail(auth, em);
        $('gErr').style.color = 'var(--green)';
        $('gErr').textContent = 'Reset link sent. Check your email.'; }
  catch (e) { $('gErr').textContent = 'Could not send that. ' + (e.code || 'no connection'); }
};
$('gLocal').onclick = () => { localStorage.setItem('gearroom.mode','local'); startApp('local'); };

/* ---- boot: paint first, network second ----
   Whatever mode we were in last time, render it straight from localStorage so
   the app is usable in well under a second even with no signal. Firebase then
   loads in the background and takes over if it can. */
const savedMode = localStorage.getItem('gearroom.mode');
if (savedMode === 'local' || savedMode === 'cloud') startApp(savedMode);
else { $('gate').classList.remove('hide'); }

ensureFb().then(() => {
  onAuthStateChanged(auth, user => {
    if (user) {
      S.uid = user.uid; S.email = user.email || '';
      localStorage.setItem('gearroom.mode','cloud');
      if (!localStorage.getItem('gearroom.me')) {
        const guess = ROSTER.find(n => (user.email||'').toLowerCase().startsWith(n.toLowerCase()));
        if (guess) localStorage.setItem('gearroom.me', guess);
      }
      if (S.mode !== 'cloud') startApp('cloud'); else { startSync(); render(); }
    } else {
      stopSync();
      if (localStorage.getItem('gearroom.mode') === 'local') { if (!S.mode) startApp('local'); }
      else {
        localStorage.removeItem('gearroom.mode');
        $('app').classList.add('hide'); $('gate').classList.remove('hide'); S.mode = null;
      }
    }
  });
}).catch(() => {
  /* offline or the CDN is unreachable. Keep working locally, say so plainly. */
  setDot('offline');
  if (!S.mode) {
    $('gErr').textContent = 'No connection right now. Tap "Use on this device only" to keep working.';
  } else if (S.mode === 'cloud') {
    toast('Working offline - changes will sync later');
  }
});
</script>
